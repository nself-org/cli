# Hasura table metadata for nself db reconcile.
- table:
    schema: "public"
    name: "notes"
  select_permissions:
    - role: "user"
      permission:
        columns:
          - "id"
          - "source_account_id"
          - "title"
          - "created_at"
        filter:
          _and:
            - source_account_id:
                _eq: "X-Hasura-Source-Account-Id"
            - _exists:
                _table:
                  schema: "public"
                  name: "app_members"
                _where:
                  user_id:
                    _eq: "X-Hasura-User-Id"
                  source_account_id:
                    _eq: "X-Hasura-Source-Account-Id"
  insert_permissions:
    - role: "user"
      permission:
        check:
          _and:
            - source_account_id:
                _eq: "X-Hasura-Source-Account-Id"
            - _exists:
                _table:
                  schema: "public"
                  name: "app_members"
                _where:
                  user_id:
                    _eq: "X-Hasura-User-Id"
                  source_account_id:
                    _eq: "X-Hasura-Source-Account-Id"
        columns:
          - "title"
        set:
          source_account_id: "X-Hasura-Source-Account-Id"
  update_permissions:
    - role: "user"
      permission:
        columns:
          - "title"
        filter:
          _and:
            - source_account_id:
                _eq: "X-Hasura-Source-Account-Id"
            - _exists:
                _table:
                  schema: "public"
                  name: "app_members"
                _where:
                  user_id:
                    _eq: "X-Hasura-User-Id"
                  source_account_id:
                    _eq: "X-Hasura-Source-Account-Id"
        check:
          _and:
            - source_account_id:
                _eq: "X-Hasura-Source-Account-Id"
            - _exists:
                _table:
                  schema: "public"
                  name: "app_members"
                _where:
                  user_id:
                    _eq: "X-Hasura-User-Id"
                  source_account_id:
                    _eq: "X-Hasura-Source-Account-Id"
  delete_permissions:
    - role: "user"
      permission:
        filter:
          _and:
            - source_account_id:
                _eq: "X-Hasura-Source-Account-Id"
            - _exists:
                _table:
                  schema: "public"
                  name: "app_members"
                _where:
                  user_id:
                    _eq: "X-Hasura-User-Id"
                  source_account_id:
                    _eq: "X-Hasura-Source-Account-Id"
