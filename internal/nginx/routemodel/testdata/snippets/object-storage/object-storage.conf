upstream object_storage_backend {
    server 127.0.0.1:3301;
    keepalive 32;
}

server {
    listen 443 ssl;
    server_name object-storage.${NSELF_DOMAIN};

    ssl_certificate     /etc/nginx/ssl/${NSELF_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/${NSELF_DOMAIN}/privkey.pem;

    client_max_body_size 1024m;

    location / {
        proxy_pass         http://object_storage_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
