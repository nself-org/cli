upstream admin_api {
    server 127.0.0.1:3212;
    keepalive 32;
}

server {
    listen 443 ssl;
    server_name admin-api.${NSELF_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${NSELF_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${NSELF_DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10m;

    location / {
        proxy_pass         http://admin_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location /health {
        proxy_pass http://admin_api/health;
        access_log off;
    }
}

server {
    listen 80;
    server_name admin-api.${NSELF_DOMAIN};
    return 301 https://$host$request_uri;
}
