upstream compliance_backend {
    server 127.0.0.1:3211;
    keepalive 32;
}

server {
    listen 80;
    server_name compliance.${NSELF_DOMAIN};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name compliance.${NSELF_DOMAIN};

    # SSL certificates managed by nself
    ssl_certificate     /etc/nginx/ssl/${NSELF_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/${NSELF_DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10m;

    location / {
        proxy_pass         http://compliance_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /health {
        proxy_pass         http://compliance_backend/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log         off;
    }
}
