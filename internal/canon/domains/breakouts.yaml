  server list: {side_effect: read, json: legacy}
  server provision: {side_effect: remote, json: legacy}
  # cmd/commands/server_resize.go:44 changes the server type on Hetzner; --upgrade-disk is permanent
  server resize: {side_effect: remote, json: legacy, flags: {upgrade-disk: {side_effect: destructive}}}
