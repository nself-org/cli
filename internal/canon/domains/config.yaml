# Authored (not generated). Canon fragment "config" (contract:cli.canon-fragments v1, P7-CANON-02).
# Keys are canonical (v1.5) command paths without the leading "nself ", sorted. Rules: internal/canon/domains.go.
schema_version: 1
commands:
  # cmd/commands/config.go:22 RunE path changes no persistent state (prints/reads only)
  config: {canon: core, side_effect: read, flags: {reveal: {cli_only: true}}}
  # cmd/commands/env.go:32 RunE path changes no persistent state (prints/reads only)
  config env: {side_effect: read}
  config env copy: {side_effect: write}
  config env diff: {side_effect: read}
  config env explain: {side_effect: read, flags: {reveal: {cli_only: true}}}
  config env list: {side_effect: read}
  config env show: {side_effect: read}
  # cmd/commands/env_target.go:40 RunE path changes no persistent state (prints/reads only)
  config env target: {side_effect: read}
  # cmd/commands/env_target_crud.go:119 runs ssh-keyscan against a caller-chosen host and can repoint a deploy target
  config env target add: {side_effect: remote, confirm: {flags: []}}
  config env target list: {side_effect: read, json: legacy}
  config env target migrate: {side_effect: write}
  # cmd/commands/env_target_probe.go:38 RunE path changes no persistent state (prints/reads only)
  config env target probe: {side_effect: read, json: legacy}
  # cmd/commands/env_target_crud.go:204 removes one server entry from control-plane.yaml; `env target add` restores it (write, not destructive)
  config env target remove: {side_effect: write}
  config env use: {side_effect: write}
  # cmd/commands/config_explain.go reads the env cascade files and prints where a key comes from; --reveal prints values, so it stays CLI-only
  config explain: {side_effect: read, flags: {reveal: {cli_only: true}}}
  # cmd/commands/config_export_import.go:22 writes to stdout by default; --output escalates to write
  # surface cli-only: prints the exported key/value pairs, secret values included with --reveal; secret output stays on the terminal
  config export: {side_effect: read, surface: cli-only, flags: {output: {side_effect: write}}}
  # cmd/commands/feature.go:48 RunE path changes no persistent state (prints/reads only)
  config features: {side_effect: read}
  config features disable: {side_effect: write}
  config features enable: {side_effect: write}
  config features list: {side_effect: read, json: legacy}
  config features status: {side_effect: read, json: legacy}
  config get: {side_effect: read}
  # cmd/commands/config_export_import.go:131 --force overwrites existing values without the prompt; the old values are not restorable
  config import: {side_effect: write, flags: {force: {side_effect: destructive}}, confirm: {flags: []}}
  config list: {side_effect: read}
  # cmd/commands/oauth_refresh.go:18 RunE path changes no persistent state (prints/reads only)
  config oauth: {side_effect: read}
  # cmd/commands/oauth_refresh.go:59 triggers a token refresh on the remote OAuth service
  config oauth refresh: {side_effect: remote, confirm: {flags: []}}
  # cmd/commands/secrets.go:29 RunE path changes no persistent state (prints/reads only)
  config secrets: {side_effect: read}
  # cmd/commands/secrets_audit.go:86 RunE path changes no persistent state (prints/reads only)
  config secrets audit: {side_effect: read}
  # cmd/commands/secrets_audit.go:69 RunE path changes no persistent state (prints/reads only)
  # surface cli-only: prints every decrypted secret as KEY=VALUE; no useful machine answer without the values
  # D-0216: --reveal is the explicit opt-in for plaintext on a non-terminal stdout (v1.5) and never combines with --json, which carries names only.
  config secrets decrypt-on-deploy: {side_effect: read, surface: cli-only, flags: {reveal: {cli_only: true, json: none}}}
  config secrets edit: {side_effect: write, output: interactive} # opens $EDITOR on the decrypted store and needs a TTY
  # surface cli-only: prints the decrypted value; no useful machine answer without it (escalate_if ruling)
  config secrets get: {side_effect: read, surface: cli-only}
  config secrets init: {side_effect: write}
  # cmd/commands/secrets_audit.go:112 RunE path changes no persistent state (prints/reads only)
  config secrets lint: {side_effect: read}
  config secrets list: {side_effect: read}
  # cmd/commands/secrets_schedule.go:103 RunE path changes no persistent state (prints/reads only)
  config secrets list-schedules: {side_effect: read}
  # cmd/commands/secrets_recipients.go:25 RunE prints help or public recipient metadata
  config secrets recipients: {side_effect: read}
  config secrets recipients add: {side_effect: write, surface: cli-only}
  # cmd/commands/secrets_recipients.go RunE reads public recipients from the encrypted store
  config secrets recipients list: {side_effect: read, surface: cli-only}
  # cmd/commands/secrets_recipients.go RunE re-encrypts without the removed recipient
  config secrets recipients remove: {side_effect: destructive, surface: cli-only, confirm: {flags: []}}
  # cmd/commands/secrets_audit.go:133 re-encrypts the store; --remove can lock the caller out of it and the old ciphertext is not restorable without another key holder
  config secrets rekey: {side_effect: destructive, confirm: {flags: []}}
  # cmd/commands/secrets_resolve.go:91 RunE reads encrypted stores; values delivered only to FIFO stdout
  config secrets resolve: {side_effect: read, surface: cli-only}
  # cmd/commands/secrets_edit_rotate.go:124 deletes the _PREVIOUS variant of a dual-window rotated secret
  config secrets retire: {side_effect: destructive, confirm: {flags: []}}
  # cmd/commands/secrets_edit_rotate.go:94 replaces a secret with a new random value; the old value is not restorable without --dual-window
  config secrets rotate: {side_effect: destructive, confirm: {flags: []}}
  # cmd/commands/secrets_audit.go:29 RunE path changes no persistent state (prints/reads only)
  config secrets rotation-log: {side_effect: read}
  config secrets schedule: {side_effect: write}
  # cmd/commands/secrets_core.go:40 overwrites a stored secret with a caller-chosen value; the old value is not restorable
  config secrets set: {side_effect: destructive, secret_args: [VALUE], confirm: {flags: []}}
  config secrets verify: {side_effect: read}
  # arbitrary secret overwrites need a plan confirmation round trip.
  # cmd/commands/config_set_plan.go:45 destructive (D-0403): it can overwrite any .env secret, and canon escalations key on flags, not on argument values, so every machine call takes the D3 nonce round trip and then runs with --yes.
  config set: {side_effect: destructive, secret_args: [value], confirm: {flags: [yes]}}
  config show: {side_effect: read}
  # cmd/commands/telemetry.go:42 RunE path changes no persistent state (prints/reads only)
  config telemetry: {side_effect: read}
  config telemetry off: {side_effect: write}
  config telemetry on: {side_effect: write}
  config telemetry status: {side_effect: read}
  # surface cli-only: OS administrator prompts cannot be answered by a machine child.
  config trust: {side_effect: write, surface: cli-only}
  # surface cli-only: OS administrator prompts cannot be answered by a machine child.
  config trust dns: {side_effect: write, surface: cli-only}
  # cmd/commands/ssl.go:38 RunE path changes no persistent state (prints/reads only)
  config trust ssl: {side_effect: read}
  # cmd/commands/ssl_renewal.go:38 v1.5 makes the ACME engine the default (P7-LIVE-22): add, renew and setup reach the CA; accepting its terms is the invoker-owned consent flag
  config trust ssl add: {side_effect: remote, confirm: {flags: [agree-tos]}}
  # cmd/commands/ssl_renewal.go:38 v1.5 ACME default (P7-LIVE-22): renew reaches the CA; agree-tos is the invoker-owned consent flag
  config trust ssl renew: {side_effect: remote, confirm: {flags: [agree-tos]}}
  # cmd/commands/ssl_renewal.go:38 v1.5 ACME default (P7-LIVE-22): setup reaches the CA; agree-tos is the invoker-owned consent flag
  config trust ssl setup: {side_effect: remote, confirm: {flags: [agree-tos]}}
  config trust ssl status: {side_effect: read}
  config trust status: {side_effect: read, exit_codes: {"0": "all trust components configured and no expiry warnings", "2": "one or more components missing or cert expiry <30 days"}}
  config validate: {side_effect: read, exit_codes: {"1": "one or more validators fail (exits 0 when all pass)"}}
moves:
  - {from: env, to: config env, since: v1.5.0, removal_at: v1.6.0}
  - {from: oauth, to: config oauth, since: v1.5.0, removal_at: v1.6.0}
  - {from: secrets, to: config secrets, since: v1.5.0, removal_at: v1.6.0}
  - {from: telemetry, to: config telemetry, since: v1.5.0, removal_at: v1.6.0}
  - {from: trust, to: config trust, since: v1.5.0, removal_at: v1.6.0}
