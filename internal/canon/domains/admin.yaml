# Authored (not generated). Canon fragment "admin" (contract:cli.canon-fragments v1, P7-CANON-02).
# Keys are canonical (v1.5) command paths without the leading "nself ", sorted. Rules: internal/canon/domains.go.
schema_version: 1
commands:
  # cmd/commands/admin.go:126 RunE path changes no persistent state (prints/reads only)
  admin: {canon: plugin, side_effect: read}
  # cmd/commands/admin_connect.go:49 opens an SSH tunnel and bootstraps the admin session on the remote host
  admin connect: {canon: plugin, side_effect: remote, output: interactive} # holds an SSH tunnel open until Ctrl+C or the UI disconnects and prints no NDJSON records: no envelope and no stream framing, not exposed on machine surfaces
  # cmd/commands/admin.go:245 RunE path changes no persistent state (prints/reads only)
  admin health: {canon: plugin, side_effect: read}
  admin logs: {canon: plugin, side_effect: read, flags: {follow: {output: stream}}} # P7-REG-03: --follow never ends by itself, so it is framed as NDJSON (contract:cli.json-stream v1)
  # cmd/commands/admin_projects.go:20 RunE path changes no persistent state (prints/reads only)
  admin projects: {canon: plugin, side_effect: read}
  admin projects add: {canon: plugin, side_effect: write}
  admin projects list: {canon: plugin, side_effect: read, json: legacy}
  # cmd/commands/admin_projects.go:97 removes one entry from the local admin project config; `admin projects add` restores it (write, not destructive)
  admin projects remove: {canon: plugin, side_effect: write}
  # --expose-network binds Admin to 0.0.0.0 (credentials and sensitive operations on the network): a CLI decision, never a machine request
  admin start: {canon: plugin, side_effect: write, flags: {expose-network: {cli_only: true}}}
  admin stop: {canon: plugin, side_effect: write}
