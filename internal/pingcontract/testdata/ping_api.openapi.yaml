      - "trial"
      x-auth: "license"
  "/user/licenses":
    get:
      summary: "Return all licenses associated with the authenticated user account"
      responses:
        default:
          description: "Response schema not specified yet; see api-routes.yaml."
      tags:
      - "user"
      x-auth: "license"
  "/user/products":
    get:
      summary: "Return all products and bundles accessible to the authenticated user"
      responses:
        default:
          description: "Response schema not specified yet; see api-routes.yaml."
      tags:
      - "user"
      x-auth: "license"
  "/v1/account/free-register":
    post:
      summary: "Register a free account — canonical path for CLI >= v1.1.x"
      responses:
        default:
          description: "Response schema not specified yet; see api-routes.yaml."
      tags:
      - "user"
      x-auth: "none"
  "/v1/telemetry/plugin-install":
    post:
      summary: "Record a plugin install event with version and platform metadata"
      responses:
        default:
          description: "Response schema not specified yet; see api-routes.yaml."
      tags:
      - "telemetry"
      x-auth: "none"
  "/version":
    get:
      operationId: "getVersion"
      summary: "CLI version info for update checks"
      responses:
        "200":
          description: "Version information"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/VersionResponse"
      tags:
      - "health"
      x-auth: "none"
  "/version/latest/{product}":
    get:
      operationId: "getLatestVersion"
      summary: "Latest version for a given product slug"
      description: "Returns the latest released version for a product (cli, admin, ping_api,\nnclaw, nchat, ntask, ntv, clawde). Sourced from environment variables\n(LATEST_<PRODUCT>_VERSION). No auth required — public endpoint.\nResponse is cached 5 minutes (Cache-Control: public, max-age=300).\n"
      parameters:
      - in: "path"
        name: "product"
        required: true
        schema:
          type: "string"
          enum:
          - "cli"
          - "admin"
          - "ping_api"
          - "nclaw"
          - "nchat"
          - "ntask"
          - "ntv"
          - "clawde"
        description: "Product slug"
      responses:
        "200":
          description: "Latest version info"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ProductVersionResponse"
        "400":
          description: "Invalid product slug (bad characters)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Unknown product slug"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      tags:
      - "health"
      x-auth: "none"
  "/waitlist":
    post:
      summary: "Add an email to the waitlist for an upcoming product or feature"
      responses:
        default:
          description: "Response schema not specified yet; see api-routes.yaml."
      tags:
      - "user"
      x-auth: "none"
  "/webhooks/hubspot":
    post:
      summary: "Receive HubSpot CRM notification events for contact sync"
      responses:
        default:
          description: "Response schema not specified yet; see api-routes.yaml."
      tags:
      - "webhook"
      x-auth: "none"
      x-internal: true
  "/webhooks/lemonsqueezy":
    post:
      summary: "Receive Lemon Squeezy payment events — verified via X-Signature HMAC"
      responses:
        default:
          description: "Response schema not specified yet; see api-routes.yaml."
      tags:
      - "webhook"
      - "billing"
      x-auth: "none"
      x-internal: true
  "/webhooks/mail/bounce":
    post:
      summary: "Receive Postmark bounce and complaint events — suppresses recipient on hard bounce"
      responses:
        default:
          description: "Response schema not specified yet; see api-routes.yaml."
      tags:
      - "webhook"
      - "mail"
      x-auth: "none"
      x-internal: true
  "/webhooks/stripe":
    post:
      operationId: "handleStripeWebhook"
      summary: "Stripe payment webhook"
      description: "Receives Stripe lifecycle events and updates license state.\nEvents handled: checkout.session.completed (create/activate license),\ninvoice.payment_succeeded (extend renewal_date by 1 year),\ninvoice.payment_failed (mark payment_failed), and\ncustomer.subscription.deleted (expire license).\nIdempotent: duplicate events are detected via the stripe_events table\nand return { received: true, idempotent: true }.\nIMPORTANT: route uses express.raw() — the body must be a raw Buffer\nso Stripe can verify the Stripe-Signature header.\n"
      parameters:
      - in: "header"
        name: "Stripe-Signature"
        required: true
        schema:
          type: "string"
        description: "Stripe webhook signature (t=timestamp,v1=hash)"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              description: "Raw Stripe event JSON (parsed by Stripe SDK after signature verification)"
      responses:
        "200":
          description: "Event received and processed (or already processed)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/WebhookResponse"
        "400":
          description: "Invalid or missing Stripe-Signature"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: "STRIPE_WEBHOOK_SECRET not configured"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      tags:
      - "webhook"
      - "billing"
      x-auth: "none"
      x-internal: true
components:
  securitySchemes:
    AdminBearer:
      type: "http"
      scheme: "bearer"
      description: "Bearer token matching server-side ADMIN_API_KEY environment variable"
  schemas:
    ValidateRequest:
      type: "object"
      required:
      - "license_key"
      properties:
        license_key:
          type: "string"
          description: "License key (nself_pro_* prefix, 32+ chars)"
          example: "nself_pro_valid0000000000000000000000000"
        domain:
          type: "string"
          description: "Domain the plugin is being installed on"
          example: "example.com"
        plugin_name:
          type: "string"
          description: "Plugin slug to check install permission"
          example: "ai"
        cli_version:
          type: "string"
          description: "CLI version making the request"
          example: "1.0.0"
    ValidateResponse:
      type: "object"
      required:
      - "valid"
      properties:
        valid:
          type: "boolean"
        tier:
          type: "string"
          description: "License tier (present when valid is true)"
        features:
          type: "array"
          items:
            type: "string"
          description: "License feature flags"
        entitlements:
          type: "array"
          items:
            type: "string"
          description: "Plugins available in the tier"
        can_install_plugin:
          type: "boolean"
          description: "Whether the license can install the requested plugin"
        upgrade_required:
          type: "boolean"
          description: "Whether the user needs to upgrade to a higher tier"
        expires_at:
          type: "string"
          nullable: true
          description: "License expiry timestamp (ISO 8601)"
        renewal_date:
          type: "string"
          nullable: true
          description: "Next renewal date (ISO 8601)"
        max_domains:
          type: "integer"
          description: "Maximum domains allowed on this license"
        plugin_access:
          type: "boolean"
          description: "Whether this specific plugin is in the access list"
        organization:
          type: "string"
          nullable: true
          description: "Organization name if present"
        error:
          type: "string"
          description: "Error description (present when valid is false)"
        jwt:
          type: "string"
          description: "Ed25519 licence JWT (sub = sha256 of the key, iat, exp, 24 h). Always present on a valid reply when the signing key is configured."
        jwt_kid:
          type: "string"
          description: "Key id of the JWT signing key."
        jwt_expires_at:
          type: "integer"
          description: "JWT expiry, unix seconds."
    BundleValidateResponse:
      type: "object"
      required:
      - "valid"
      - "tier"
      - "bundle"
      properties:
        valid:
          type: "boolean"
        tier:
          type: "string"
        bundle:
          type: "string"
          description: "The bundle name exactly as requested."
        plugins:
          type: "array"
          items:
            type: "string"
        reason:
          type: "string"
          description: "Denial reason (present when valid is false)."
        key_hash:
          type: "string"
          pattern: "^[0-9a-f]{64}$"
          description: "Lowercase hex sha256 of the licence key (same as the jwt sub). Present when valid is true."
        issued_at:
          type: "integer"
          description: "Unix seconds. Present when valid is true."
        expires_at:
          type: "integer"
          description: "Unix seconds; 0 < expires_at - issued_at <= 86400. Present when valid is true. The CLI refuses a reply outside this window."
    ValidateErrorResponse:
      type: "object"
      required:
      - "valid"
      - "error"
      properties:
        valid:
          type: "boolean"
          enum:
          - false
        error:
          type: "string"
          description: "Error description"
    ActivateRequest:
      type: "object"
      required:
      - "license_key"
      - "domain"
      properties:
        license_key:
          type: "string"
          description: "License key to activate"
          example: "nself_pro_valid0000000000000000000000000"
        domain:
          type: "string"
          description: "Domain to register with the license"
          example: "myapp.example.com"
    ActivateResponse:
      type: "object"
      properties:
        activated:
          type: "boolean"
          description: "Whether the domain was successfully activated"
        domain:
          type: "string"
          description: "The activated domain (present on success)"
        license_id:
          type: "string"
          description: "License UUID (present on success)"
        error:
          type: "string"
          description: "Error description (present on failure)"
    ActivateErrorResponse:
      type: "object"
      required:
      - "activated"
      - "error"
      properties:
        activated:
          type: "boolean"
          enum:
          - false
        error:
          type: "string"
    TelemetryRequest:
      type: "object"
      properties:
        installId:
          type: "string"
          description: "Anonymous install identifier"
        cliVersion:
          type: "string"
          example: "1.0.0"
        platform:
          type: "string"
          example: "linux"
        arch:
          type: "string"
          example: "x86_64"
        services:
          type: "array"
          items:
            type: "string"
          description: "List of enabled services"
        event:
          type: "string"
          description: "Event identifier (e.g. ping, cli.start, plugin.install)"
        metadata:
          type: "object"
          additionalProperties: true
          description: "Arbitrary key-value event metadata"
    TelemetryResponse:
      type: "object"
      required:
      - "success"
      - "message"
      - "timestamp"
      properties:
        success:
          type: "boolean"
        message:
          type: "string"
        timestamp:
          type: "string"
          description: "ISO 8601 timestamp"
    HealthResponse:
      type: "object"
      required:
      - "status"
      - "service"
      - "version"
      - "timestamp"
      properties:
        status:
          type: "string"
          enum:
          - "healthy"
        service:
          type: "string"
          description: "Service name"
          example: "nself-ping"
        version:
          type: "string"
          description: "Service version"
          example: "0.1.0"
        timestamp:
          type: "string"
          description: "ISO 8601 timestamp"
    MigrationInfo:
      type: "object"
      description: "Present only when the request User-Agent is a v0.9.x CLI. Guides legacy users to the migration path."
      required:
      - "available"
      - "from"
      - "to"
      - "guide_url"
      properties:
        available:
          type: "boolean"
          example: true
        from:
          type: "string"
          description: "Detected legacy version (from User-Agent)"
          example: "0.9.9"
        to:
          type: "string"
          description: "Current recommended version"
          example: "1.0.9"
        guide_url:
          type: "string"
          description: "URL of the upgrade guide"
          example: "https://docs.nself.org/migrate/from-v0.9"
    VersionResponse:
      type: "object"
      required:
      - "service"
      - "version"
      - "apiVersion"
      - "latestCliVersion"
      - "minCliVersion"
      - "environment"
      properties:
        service:
          type: "string"
          example: "nself-ping"
        version:
          type: "string"
          example: "0.1.0"
        apiVersion:
          type: "string"
          example: "v1"
        latestCliVersion:
          type:
          - "string"
          - "null"
          description: "Latest published CLI version (the GitHub Latest release of nself-org/cli). null only together with stale true: no successful lookup yet, or the last good value is older than 24 hours."
          example: "1.0.9"
        stale:
          type: "boolean"
          description: "Present and true only when the upstream lookup failed (the value is the last good one, or null if there is none or it is older than 24 hours). Absent otherwise."
        minCliVersion:
          type: "string"
          example: "0.3.0"
        environment:
          type: "string"
          example: "development"
        migration:
          $ref: "#/components/schemas/MigrationInfo"
          description: "Present only for v0.9.x User-Agent requests (S60-T05)"
    ErrorResponse:
      type: "object"
      required:
      - "error"
      properties:
        error:
          type: "string"
        code:
          type: "string"
    LicenseKeyEntry:
      type: "object"
      required:
      - "kid"
      - "alg"
      - "kty"
      - "crv"
      - "x"
      - "pem"
      properties:
        kid:
          type: "string"
          description: "Key identifier (matches `kid` in signed JWTs)"
          example: "key-2024-01"
        alg:
          type: "string"
          description: "Signing algorithm"
          example: "EdDSA"
        kty:
          type: "string"
          description: "Key type"
          example: "OKP"
        crv:
          type: "string"
          description: "Elliptic curve"
          example: "Ed25519"
        x:
          type: "string"
          description: "Base64url-encoded public key material"
        pem:
          type: "string"
          description: "PEM-encoded public key for CLI verification"
        retires_at:
          type: "string"
          nullable: true
          description: "ISO 8601 timestamp after which this key will no longer sign new JWTs"
    LicenseKeysResponse:
      type: "object"
      required:
      - "keys"
      - "count"
      - "fetched_at"
      - "refresh_interval_seconds"
      properties:
        keys:
          type: "array"
          items:
            $ref: "#/components/schemas/LicenseKeyEntry"
        count:
          type: "integer"
          description: "Number of keys in the response"
        fetched_at:
          type: "string"
          description: "ISO 8601 server timestamp"
        refresh_interval_seconds:
          type: "integer"
          description: "Recommended client cache duration in seconds"
          example: 3600
    LicenseLifecycleResponse:
      type: "object"
      required:
      - "tier"
      - "status"
      - "lifecycle_state"
      - "revoked"
      - "renewal_date"
      - "fetched_at"
      properties:
        tier:
          type: "string"
          description: "License tier (basic, pro, elite, business, businessplus, enterprise, owner)"
          example: "pro"
        status:
          type: "string"
          description: "Raw database status column value"
          example: "active"
        lifecycle_state:
          type: "string"
          enum:
          - "active"
          - "grace"
          - "expired"
          - "revoked"
          - "cancelled"
          - "payment_failed"
          - "suspended"
          - "perpetual"
          description: "Computed lifecycle state. `grace` means expired but within the 30-day grace window."
        revoked:
          type: "boolean"
          description: "Whether the key has been explicitly revoked"
        revoked_at:
          type: "string"
          nullable: true
          description: "ISO 8601 timestamp of revocation, if applicable"
        renewal_date:
          type: "string"
          nullable: true
          description: "ISO 8601 next renewal date (null for perpetual licenses)"
        issued_at:
          type: "string"
          nullable: true
          description: "ISO 8601 issuance timestamp"
        activated_at:
          type: "string"
          nullable: true
          description: "ISO 8601 first activation timestamp"
        days_remaining:
          type: "integer"
          nullable: true
          description: "Days until renewal_date (null when not active or perpetual)"
        grace_days_remaining:
          type: "integer"
          description: "Days remaining in the 30-day grace period (0 when not in grace)"
        fetched_at:
          type: "string"
          description: "ISO 8601 server timestamp of this response"
    RevocationEntry:
      type: "object"
      required:
      - "key_hash"
      - "revoked_at"
      - "reason"
      properties:
        key_hash:
          type: "string"
          description: "SHA-256 hash of the license key (hex-encoded)"
        revoked_at:
          type: "string"
          nullable: true
          description: "ISO 8601 revocation timestamp"
        reason:
          type: "string"
          description: "Revocation reason string (defaults to \"unspecified\")"
    RevocationListResponse:
      type: "object"
      required:
      - "revocations"
      - "count"
      - "fetched_at"
      - "poll_interval_seconds"
      properties:
        revocations:
          type: "array"
          items:
            $ref: "#/components/schemas/RevocationEntry"
        count:
          type: "integer"
          description: "Number of revoked keys in the response"
        fetched_at:
          type: "string"
          description: "ISO 8601 server timestamp"
        poll_interval_seconds:
          type: "integer"
          description: "Recommended client poll interval in seconds"
          example: 3600
    RevokeRequest:
      type: "object"
      required:
      - "license_key"
      properties:
        license_key:
          type: "string"
          description: "License key to revoke"
          example: "nself_pro_valid0000000000000000000000000"
        reason:
          type: "string"
          description: "Human-readable revocation reason (stored in revoked_by column)"
          example: "subscription_cancelled"
    RevokeResponse:
      type: "object"
      required:
      - "revoked"
      - "license_key"
      - "revoked_at"
      properties:
        revoked:
          type: "boolean"
          enum:
          - true
        license_key:
          type: "string"
          description: "The revoked license key"
        revoked_at:
          type: "string"
          description: "ISO 8601 timestamp of revocation"
    WebhookResponse:
      type: "object"
      required:
      - "received"
      properties:
        received:
          type: "boolean"
          enum:
          - true
        idempotent:
          type: "boolean"
          description: "Present and true when the event was already processed (duplicate delivery)"
    SeatsResponse:
      type: "object"
      required:
      - "seats"
      - "machines"
      - "max_seats"
      properties:
        license_id:
          type: "string"
          description: "License UUID (absent when DB is unavailable / fail-open)"
        tier:
          type: "string"
          description: "License tier (absent when DB is unavailable)"
        seats:
          type: "integer"
          description: "Number of activated domains / seats"
          example: 3
        machines:
          type: "integer"
          description: "Number of unique machines seen (from license_machines table)"
          example: 2
        max_seats:
          type: "integer"
          description: "Maximum allowed seats. -1 = unlimited (owner/enterprise tiers)"
          example: 5
        unlimited:
          type: "boolean"
          description: "True when max_seats is -1 (owner/enterprise tier)"
        note:
          type: "string"
          description: "Present when returning a fail-open response (DB unavailable)"
    TelemetryAggregateResponse:
      type: "object"
      required:
      - "period_days"
      - "generated_at"
      - "commands"
      - "cli_versions"
      - "daily_trend"
      - "os_distribution"
      properties:
        period_days:
          type: "integer"
          description: "Lookback window used for this response"
          example: 7
        generated_at:
          type: "string"
          description: "ISO 8601 server timestamp"
        commands:
          type: "array"
          description: "Command-level histogram"
          items:
            type: "object"
            properties:
              command:
                type: "string"
              total:
                type: "string"
              avg_duration_ms:
                type: "string"
              licensed_count:
                type: "string"
        cli_versions:
          type: "array"
          description: "CLI version distribution"
          items:
            type: "object"
            properties:
              cli_version:
                type: "string"
              count:
                type: "string"
        daily_trend:
          type: "array"
          description: "Daily event totals for trend chart"
          items:
            type: "object"
            properties:
              day:
                type: "string"
                description: "ISO 8601 day bucket"
              events:
                type: "string"
              unique_installs:
                type: "string"
        os_distribution:
          type: "array"
          description: "OS type distribution"
          items:
            type: "object"
            properties:
              os_type:
                type: "string"
              count:
                type: "string"
    ProductVersionResponse:
      type: "object"
      required:
      - "product"
      - "version"
      - "min_version"
      - "updated_at"
      properties:
        product:
          type: "string"
          description: "Product slug"
          example: "cli"
        version:
          type: "string"
          description: "Latest version (semver)"
          example: "1.0.9"
        min_version:
          type: "string"
          description: "Minimum supported version (semver)"
          example: "0.9.0"
        updated_at:
          type: "string"
          description: "ISO 8601 server timestamp"
