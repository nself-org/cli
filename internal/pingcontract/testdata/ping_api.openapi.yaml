  "/license/validate":
    post:
      operationId: "validateLicense"
      summary: "Validate a license key and check plugin entitlement"
      description: "Main form (no `bundle` query): body carries `license_key`; a valid reply\nalways carries `jwt` (sub = sha256 of the key, iat, exp) when the\nsigning key is configured.\n\nBundle form (`?bundle=<name>`, key in `X-NSelf-License-Key`): a valid\nreply is bound to the requesting key and bundle (`bundle`, `key_hash`,\n`issued_at`, `expires_at`).\n\nEvery valid reply is signed: `X-NSelf-License-Sig` is the hex Ed25519\nsignature (LICENSE_JWT_PRIVATE_KEY, kid in `jwt_kid`) over the exact\nresponse body bytes. A configured key that cannot sign or issue the jwt\nanswers 500, never an unsigned valid reply.\n"
      parameters:
      - name: "bundle"
        in: "query"
        required: false
        schema:
          type: "string"
        description: "Bundle entitlement form; selects BundleValidateResponse."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ValidateRequest"
      responses:
        "200":
          description: "Validation result (valid or invalid with details)"
          headers:
            X-NSelf-License-Sig:
              description: "Hex Ed25519 signature over the exact response body bytes. Present on every valid reply when LICENSE_JWT_PRIVATE_KEY is configured."
              schema:
                type: "string"
                pattern: "^[0-9a-f]{128}$"
          content:
            "application/json":
              schema:
                oneOf:
                - $ref: "#/components/schemas/ValidateResponse"
                - $ref: "#/components/schemas/BundleValidateResponse"
        "400":
          description: "Missing required license_key field"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ValidateErrorResponse"
        "500":
          description: "Internal validation service error"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ValidateErrorResponse"
        "503":
          description: "Database not configured"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ValidateErrorResponse"
      tags:
      - "license"
      x-auth: "none"
