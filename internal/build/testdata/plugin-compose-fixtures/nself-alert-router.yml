# nself-alert-router compose fragment
# Injected by: nself build → DiscoverPluginComposeFiles()
# Port: 3834 (F10-PORT-REGISTRY)
# Generated by: plugins-pro canonical deploy pattern

version: "3.8"

services:
  nself-alert-router:
    build:
      context: ../..
      dockerfile: paid/nself-alert-router/Dockerfile
    image: nself-alert-router:latest
    container_name: nself-alert-router
    restart: unless-stopped
    environment:
      - ALERT_ROUTER_PORT=3834
      - DATABASE_URL=${DATABASE_URL}
      - ALERT_ROUTER_HMAC_SECRET=${ALERT_ROUTER_HMAC_SECRET}
      - ALERT_ROUTER_INBOUND_HMAC_SECRET=${ALERT_ROUTER_INBOUND_HMAC_SECRET:-}
      - ALERT_ROUTER_ALLOWED_DESTINATIONS=${ALERT_ROUTER_ALLOWED_DESTINATIONS:-}
      - ALERT_ROUTER_MAX_PAYLOAD_BYTES=${ALERT_ROUTER_MAX_PAYLOAD_BYTES:-1048576}
      - ALERT_ROUTER_ONCALL_ENDPOINT=${ALERT_ROUTER_ONCALL_ENDPOINT:-}
      - ALERT_ROUTER_LOG_LEVEL=${ALERT_ROUTER_LOG_LEVEL:-info}
      - REDIS_URL=${REDIS_URL:-}
      - NSELF_SOURCE_ACCOUNT_ID=${NSELF_SOURCE_ACCOUNT_ID:-primary}
    ports:
      - "3834:3834"
    networks:
      - ${DOCKER_NETWORK:-nself_network}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3834/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      - postgres
