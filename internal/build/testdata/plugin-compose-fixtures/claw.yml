services:
  claw:
    build:
      context: ${NSELF_PLUGIN_DIR}/claw
      dockerfile: Dockerfile.golang
    container_name: ${COMPOSE_PROJECT_NAME}_claw
    restart: unless-stopped
    networks:
      - ${DOCKER_NETWORK}
    ports:
      - "127.0.0.1:3710:3710"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: "3710"
      AI_PLUGIN_URL: "http://${COMPOSE_PROJECT_NAME}_ai:3709"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3710/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
