# hand-managed file: two server blocks and an http-level directive
limit_req_zone $binary_remote_addr zone=custom:10m rate=5r/s;

server {
    listen 80;
    server_name custom-a.example.test;
    location / { proxy_pass http://custom-a:8080; }
}

server {
    listen 80;
    server_name custom-b.example.test;
    location /api/ { proxy_pass http://custom-b:8081; proxy_read_timeout 30s; }
}
