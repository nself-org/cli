version: "3.8"

services:
  cdn:
    build:
      context: .
      dockerfile: Dockerfile
    image: nself/nself-cdn:latest
    container_name: nself-cdn
    restart: unless-stopped
    ports:
      - "127.0.0.1:3036:3036"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CDN_PLUGIN_PORT: 3036
      CDN_API_KEY: ${CDN_API_KEY:-}
      CDN_SIGNING_KEY: ${CDN_SIGNING_KEY:-}
      CDN_SIGNED_URL_TTL: ${CDN_SIGNED_URL_TTL:-3600}
      CDN_PURGE_BATCH_SIZE: ${CDN_PURGE_BATCH_SIZE:-30}
      CDN_CLOUDFLARE_API_TOKEN: ${CDN_CLOUDFLARE_API_TOKEN:-}
      CDN_BUNNYCDN_API_KEY: ${CDN_BUNNYCDN_API_KEY:-}
      CDN_FASTLY_API_TOKEN: ${CDN_FASTLY_API_TOKEN:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3036/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - nself-network

networks:
  nself-network:
    external: true
