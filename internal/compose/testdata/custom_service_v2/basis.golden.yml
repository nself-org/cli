networks:
    test_network:
        driver: bridge
        name: test_network
services:
    ping-api:
        build:
            context: ./services/ping_api
            dockerfile: Dockerfile
        container_name: test_ping-api
        restart: unless-stopped
        networks:
            - test_network
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            AUTH_CLIENT_URL: http://localhost:3000
            AUTH_SERVER_URL: http://auth:4000
            BASE_DOMAIN: localhost
            DATABASE_URL: postgresql://postgres:pgpass@postgres:5432/nself
            ENV: dev
            HASURA_GRAPHQL_ADMIN_SECRET: secret
            HASURA_GRAPHQL_ENDPOINT: http://hasura:8080/v1/graphql
            POSTGRES_DB: nself
            POSTGRES_HOST: postgres
            POSTGRES_PASSWORD: pgpass
            POSTGRES_PORT: "5432"
            POSTGRES_USER: postgres
            PROJECT_NAME: test
            SERVICE_NAME: ping-api
            SERVICE_PORT: "8001"
            SERVICE_ROUTE: ping
            TABLE_PREFIX: ""
        ports:
            - 127.0.0.1:8001:8001
        healthcheck:
            test:
                - CMD
                - wget
                - -qO-
                - http://127.0.0.1:8001/health
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s
        deploy:
            resources:
                limits:
                    memory: 256m
                    cpus: "0.5"
                    pids: 100
                reservations:
                    memory: 256m
        logging:
            driver: json-file
            options:
                max-file: ""
                max-size: ""
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        read_only: true
        tmpfs:
            - /tmp
            - /run
    blobs:
        image: minio/minio:RELEASE.2024-01-16T16-07-38Z
        container_name: test_blobs
        restart: unless-stopped
        networks:
            - test_network
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            AUTH_CLIENT_URL: http://localhost:3000
            AUTH_SERVER_URL: http://auth:4000
            BASE_DOMAIN: localhost
            DATABASE_URL: postgresql://postgres:pgpass@postgres:5432/nself
            ENV: dev
            HASURA_GRAPHQL_ADMIN_SECRET: secret
            HASURA_GRAPHQL_ENDPOINT: http://hasura:8080/v1/graphql
            POSTGRES_DB: nself
            POSTGRES_HOST: postgres
            POSTGRES_PASSWORD: pgpass
            POSTGRES_PORT: "5432"
            POSTGRES_USER: postgres
            PROJECT_NAME: test
            SERVICE_NAME: blobs
            SERVICE_PORT: "9000"
            SERVICE_ROUTE: ""
            TABLE_PREFIX: ""
        ports:
            - 127.0.0.1:9000:9000
        deploy:
            resources:
                limits:
                    memory: 512m
                    cpus: "1.0"
                    pids: 100
                reservations:
                    memory: 256m
        logging:
            driver: json-file
            options:
                max-file: ""
                max-size: ""
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        read_only: true
        tmpfs:
            - /tmp
            - /run
    worker:
        build:
            context: ./apps/worker
            dockerfile: Dockerfile
        container_name: test_worker
        restart: unless-stopped
        networks:
            - test_network
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            AUTH_CLIENT_URL: http://localhost:3000
            AUTH_SERVER_URL: http://auth:4000
            BASE_DOMAIN: localhost
            DATABASE_URL: postgresql://postgres:pgpass@postgres:5432/nself
            ENV: dev
            FOO: bar
            HASURA_GRAPHQL_ADMIN_SECRET: secret
            HASURA_GRAPHQL_ENDPOINT: http://hasura:8080/v1/graphql
            MODE: fast
            POSTGRES_DB: nself
            POSTGRES_HOST: postgres
            POSTGRES_PASSWORD: pgpass
            POSTGRES_PORT: "5432"
            POSTGRES_USER: postgres
            PROJECT_NAME: test
            SERVICE_NAME: worker
            SERVICE_PORT: "8003"
            SERVICE_ROUTE: ""
            SMTP_HOST: mail
            TABLE_PREFIX: ""
        volumes:
            - ./data:/data
            - named:/cache:ro
        ports:
            - 127.0.0.1:8003:8003
        healthcheck:
            test:
                - CMD
                - wget
                - -qO-
                - http://127.0.0.1:8003/ready
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s
        deploy:
            resources:
                limits:
                    memory: 128m
                    cpus: "0.25"
                    pids: 100
                reservations:
                    memory: 256m
        logging:
            driver: json-file
            options:
                max-file: ""
                max-size: ""
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        read_only: true
        tmpfs:
            - /tmp
            - /run
