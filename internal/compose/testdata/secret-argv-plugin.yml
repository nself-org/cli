# Representative plugin output: secrets belong in environment, never argv.
services:
  notify:
    image: example/notify:1
    environment:
      PLUGIN_INTERNAL_SECRET: ${PLUGIN_INTERNAL_SECRET}
      NOTIFY_INTERNAL_SECRET: ${NOTIFY_INTERNAL_SECRET}
    entrypoint: ["/app/notify"]
    command: ["serve"]
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$NOTIFY_INTERNAL_SECRET\""]
