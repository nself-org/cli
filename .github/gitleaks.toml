title = "nSelf CLI gitleaks config"

[extend]
useDefault = true

[allowlist]
paths = [
  # Test files — mock credentials are intentional test vectors
  '''.*_test\.go''',
  '''test/''',
  '''testdata/''',
  '''src/tests/''',
  '''\.bats$''',
  # Example and template env files — placeholder values only
  '''internal/config/\.env\.example''',
  '''cmd/commands/\.env\.example''',
  '''\.env\.example$''',
  '''\.example\.env$''',
  '''\.env\.template$''',
  # Migration fixtures — test database state
  '''internal/migration/testdata/''',
  # Doctor checks — redact_audit.go contains synthetic test fixtures, not real credentials
  '''internal/doctor/redact_audit\.go''',
  # Documentation and reference files — contain example credentials and API keys
  '''docs/''',
  '''\.wiki/''',
  '''\.github/wiki/''',
  '''\.github/docs/''',
  # Generated public facts (P7-TRUTH-02): openapi_sha256 is a content hash, matched as generic-api-key by name
  '''\.github/facts\.json$''',
  '''\.github/workflows/''',
  '''\.claude/''',
  # Template certificates and audit scripts
  '''bin/certs/''',
  '''src/templates/certs/''',
  '''src/lib/''',
  '''src/cli/security_audit\.sh$''',
  # vendor/ (tracked go mod vendor output) is scanned on purpose: it scans
  # clean today, and an allowlist would hide a secret a module update brings
  # in. Review a finding there, do not allowlist the tree (D-0286).
]
regexTarget = "line"
regexes = [
  # CI fixture: scripts/ci/live-safety-fixture.sh writes a synthetic POSTGRES_PASSWORD
  # into a throwaway $WORK project (.env.secrets). Not a real credential, not in the
  # vault (D-0286, re-reviewed 2026-10-19). Matched on the exact line shape, not on a
  # line number, so it survives the line moving and shallow-clone history rewrites
  # (the old .gitleaksignore fingerprints did not). This cannot also be pinned to the
  # file path: the pinned gitleaks 8.21.2 has no [[allowlists]] AND-condition and 8.30+
  # refuses [allowlist] mixed with [[allowlists]]. Any other line, or any other secret,
  # is still caught.
  '''(?m)^printf 'POSTGRES_PASSWORD=[^']+\\n' > "\$WORK/[a-z]+/project/\.env\.secrets"$''',
]
