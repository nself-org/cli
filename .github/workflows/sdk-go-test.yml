name: SDK Go Test

on:
  push:
    branches:
      - main
    paths:
      - 'sdk/go/**'
      - '.github/workflows/sdk-go-test.yml'
  pull_request:
    paths:
      - 'sdk/go/**'
      - '.github/workflows/sdk-go-test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sdk-go:
    name: Build & Test (Go SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: sdk/go/go.sum

      - name: Tidy
        run: cd sdk/go && go mod tidy

      - name: Vet
        run: cd sdk/go && go vet ./...

      - name: Test
        run: cd sdk/go && go test -timeout 5m ./...
