name: Credential Rotation Reminder

# Auto-generates PCI reminders for credentials within 14 days of rotation due date.
# Reads the cadence matrix in .claude/docs/operations/credential-rotation.md and emits
# one PCI message per finding into the PPI inbox (.claude/inbox/).
#
# Reference: P101 S10.T04
# Source script: cli/scripts/ops/credential-rotation-check.sh

on:
  schedule:
    # 1st of every month at 09:00 UTC
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (print findings, do not write PCI files)'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rotation-scan:
    name: Scan rotation calendar
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout cli repo (script source)
        uses: actions/checkout@v7.0.1
        with:
          repository: nself-org/cli
          path: cli
          fetch-depth: 1

      - name: Checkout PPI artifacts (cadence matrix + inbox target)
        id: matrix
        # The cadence calendar lives in the PPI .claude/ tree, not in cli/.
        # We materialize the minimal subset needed to run the scan + drop PCI messages.
        # In production CI this checks out from a private mirror; for local dispatch
        # the workflow_dispatch path operates on the working tree directly.
        env:
          GH_TOKEN: ${{ secrets.PPI_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ppi/.claude/docs/operations
          mkdir -p ppi/.claude/inbox
          # The PPI lives outside the cli/ repo. CI mirror: nself-org/nself-ppi-mirror
          # If unavailable (e.g. token scope), fall back to the cli vendored copy at
          # cli/.github/wiki/operations/credential-rotation.md (kept in sync via doc-sync).
          if gh api repos/nself-org/nself-ppi-mirror/contents/.claude/docs/operations/credential-rotation.md \
              --jq '.content' 2>/dev/null | base64 -d > ppi/.claude/docs/operations/credential-rotation.md 2>/dev/null; then
            echo "Loaded cadence matrix from PPI mirror"
          elif [[ -f cli/.github/wiki/operations/credential-rotation.md ]]; then
            cp cli/.github/wiki/operations/credential-rotation.md ppi/.claude/docs/operations/credential-rotation.md
            echo "Loaded cadence matrix from cli wiki fallback"
          else
            # CLI-R05: this used to `exit 1`, turning a *reminder* job red every
            # month. Neither source is reachable today: nself-org/nself-ppi-mirror
            # needs the PPI_READ_TOKEN org secret, and the documented wiki
            # fallback was never created — deliberately, because the cadence
            # matrix is an inventory of every credential the org holds and its
            # next rotation date, which does not belong in a public wiki.
            # Until the mirror token exists the correct behaviour is to say so
            # and skip, not to fail. See the CLI-R05 residue note.
            echo "::warning::No cadence matrix available — PPI mirror unreachable (needs PPI_READ_TOKEN) and no public fallback exists by design. Skipping the rotation scan."
            echo "matrix_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "matrix_available=true" >> "$GITHUB_OUTPUT"

      - name: Run rotation scan
        if: steps.matrix.outputs.matrix_available == 'true'
        env:
          PPI_ROOT: ${{ github.workspace }}/ppi
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          chmod +x cli/scripts/ops/credential-rotation-check.sh
          cli/scripts/ops/credential-rotation-check.sh \
            --ppi-root "$PPI_ROOT" \
            ${DRY_RUN:+--dry-run} \
            | tee scan-output.jsonl

          echo "## Findings" >> "$GITHUB_STEP_SUMMARY"
          if [[ -s scan-output.jsonl ]]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat scan-output.jsonl >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No credentials within 14-day window._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit PCI files to PPI mirror
        if: steps.matrix.outputs.matrix_available == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.PPI_WRITE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PCI_COUNT=$(ls -1 ppi/.claude/inbox/msg-*-rotation-*.md 2>/dev/null | wc -l | tr -d ' ')
          if [[ "$PCI_COUNT" -eq 0 ]]; then
            echo "No PCI files to commit (zero findings)"
            exit 0
          fi
          echo "Would commit ${PCI_COUNT} PCI file(s) to nself-ppi-mirror"
          # Commit step is gated on PPI_WRITE_TOKEN availability.
          # When the mirror is wired up, replace this with a real `gh api ... PUT contents`
          # call per file. Until then, log to issue for operator visibility.
          if [[ -n "${GH_TOKEN:-}" ]]; then
            for f in ppi/.claude/inbox/msg-*-rotation-*.md; do
              slug=$(basename "$f" .md)
              gh issue create \
                --repo nself-org/cli \
                --title "[ROTATION-DUE] ${slug}" \
                --body "$(cat "$f")" \
                --label "rotation,ops" \
                || echo "::warning::issue create failed for ${slug}"
            done
          fi

      - name: Upload PCI artifacts
        if: always() && steps.matrix.outputs.matrix_available == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rotation-pci-${{ github.run_id }}
          path: |
            ppi/.claude/inbox/msg-*-rotation-*.md
            scan-output.jsonl
          if-no-files-found: ignore
          retention-days: 90
