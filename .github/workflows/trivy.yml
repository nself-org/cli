name: Trivy Container Scan

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile*"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/trivy.yml"
  pull_request:
    paths:
      - "Dockerfile*"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/trivy.yml"

permissions:
  contents: read
  security-events: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  trivy:
    name: Trivy scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binary for container context
        run: CGO_ENABLED=0 GOOS=linux go build -mod=vendor -o nself ./cmd/nself/

      - name: Trivy filesystem scan (source + deps)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"

      - name: Check for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL
          exit-code: "1"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        # Upload can fail on a fork without security-events:write, or when the
        # code-scanning API is briefly unavailable. Neither must mask a scan that
        # already ran and enforced.
        # ACCEPTED: reporting side-effect only. The gate is the "Check for critical
        # vulnerabilities" step above, which exits 1 on any CRITICAL finding.
        # Expiry: permanent
        continue-on-error: true
        with:
          sarif_file: trivy-fs.sarif
          category: trivy

      - name: Create issue for HIGH findings
        if: failure()
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Trivy: Critical vulnerability found (${new Date().toISOString().split('T')[0]})`,
              body: `Trivy scan found CRITICAL vulnerabilities on \`main\`. Check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`,
              labels: ['security']
            });
