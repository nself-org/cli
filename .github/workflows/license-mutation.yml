name: Licence mutation gate

# D-0511: the licence mutation gate. Runs go-gremlins over the whole
# internal/license package (bash scripts/mutation.sh internal/license) and fails
# when any mutant survives: a surviving mutant is a code change in the licence
# seam that no test notices. D-0226 (cli#662) made the full package green
# (0 lived); this job keeps it green. Not a required check: it runs nightly, on
# demand, and on pull requests that touch the licence code or the script, so a
# survivor shows on the PR that introduced it. See .github/wiki/Plugin-Security.md.

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "internal/license/**"
      - "internal/compat/**"
      - "scripts/mutation.sh"
      - ".github/workflows/license-mutation.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: internal/license mutants (full package)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Run the licence mutation gate
        env:
          GREMLINS_WORKERS: "4"
          MUTATION_OUT: ${{ runner.temp }}/license-mutation.txt
        run: bash scripts/mutation.sh internal/license

      - name: Keep the gremlins report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: license-mutation-report
          path: ${{ runner.temp }}/license-mutation.txt
          if-no-files-found: ignore
          retention-days: 14
