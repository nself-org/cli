name: SDK Go Publish

# Go modules are served directly from GitHub via the module proxy (proxy.golang.org).
# No registry token required — the proxy fetches from the public repo.
#
# Triggers on:
#   - cli release tag (v*)               — publishes SDK in lockstep with CLI
#   - sdk-scoped tag (cli-sdk-go/v*)     — publishes SDK only (out-of-band patches)
#   - workflow_dispatch                  — manual publish with explicit version input

on:
  push:
    tags:
      - 'v*'
      - 'cli-sdk-go/v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.13). Leave blank to use sdk/go version.'
        required: false
        type: string

permissions:
  contents: write  # required to push SDK-scoped git tag

# cancel-in-progress: false — this workflow deploys/publishes/releases; a superseding
# run must queue behind an in-flight one, never cancel it mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-go-sdk:
    name: Publish Go SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify SDK module
        run: |
          cd sdk/go
          go mod verify
          go build ./...

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            echo "version=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_name }}" == cli-sdk-go/* ]]; then
            echo "version=${GITHUB_REF_NAME#cli-sdk-go/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag SDK module
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # The tag prefix MUST include the module's major-version suffix.
          # sdk/go/go.mod declares "github.com/nself-org/cli/sdk/go/v2", and for
          # a post-v1 module the major suffix is part of the module path, so the
          # tag Go looks for is "sdk/go/v2/<version>", not "sdk/go/<version>".
          #
          # This was wrong from the start: all 25 existing sdk/go/v* tags are
          # unusable. proxy.golang.org rejects them outright —
          #   invalid version: sdk/go/go.mod has post-v1 module path
          #   "github.com/nself-org/cli/sdk/go/v2" at revision sdk/go/v1.3.5
          # and `go get github.com/nself-org/cli/sdk/go/v2@v1.3.5` falls back to
          # the root module and fails with "does not contain package". The Go
          # SDK has therefore never been installable by anyone.
          SDK_TAG="sdk/go/v2/${VERSION}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Idempotent: skip if tag already exists
          if git rev-parse "${SDK_TAG}" >/dev/null 2>&1; then
            echo "Tag ${SDK_TAG} already exists — skipping."
          else
            git tag "${SDK_TAG}"
            git push origin "${SDK_TAG}"
            echo "Tagged and pushed ${SDK_TAG}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger module proxy cache
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MODULE="github.com/nself-org/cli/sdk/go/v2"
          # Request the module info from the Go module proxy to seed the cache.
          # This is best-effort; failures do not block the workflow.
          curl -sf "https://proxy.golang.org/${MODULE}/@v/${VERSION}.info" || true
          echo "Module proxy notified for ${MODULE}@${VERSION}"
