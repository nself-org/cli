name: CI Failure Auto-PCI

# S204-T05: Auto-open PCI via CRD on workflow failure.
# Triggers when any CI workflow on main fails, opens a bug PCI in
# nself PPI inbox for CRD to pick up and auto-triage.
on:
  workflow_run:
    workflows:
      - CI
      - Test
      - Release
      - Flutter CI
      - Android Build & Play Store
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  open-pci:
    name: Open bug PCI on main failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      # G14-CI-FIX: guard against missing GitHub App secrets so this meta-workflow
      # does not itself go red and hide the real CI failure. D-0159: the skip
      # used to print one plain log line nobody reads, so a failure notice could
      # vanish without a trace. A missing secret now raises a ::warning::
      # annotation (shown on the run page) and writes the failed run's details
      # to the job summary, and the job still exits 0.
      - name: Check GitHub App configured
        id: app-check
        run: |
          missing=""
          [ -n "$APP_ID" ] || missing="NSELF_DISPATCH_APP_ID"
          [ -n "$APP_KEY" ] || missing="${missing:+$missing, }NSELF_DISPATCH_APP_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::warning title=ci-failure-pci skipped::secret(s) not set: ${missing}. No PCI was sent for ${WORKFLOW_NAME} run ${RUN_URL}"
            {
              echo "### CI failure PCI skipped"
              echo ""
              echo "Secret(s) not set: \`${missing}\`. No PCI was sent for this failure."
              echo ""
              echo "- Workflow: ${WORKFLOW_NAME}"
              echo "- Branch: ${HEAD_BRANCH}"
              echo "- SHA: ${HEAD_SHA}"
              echo "- Run: ${RUN_URL}"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          APP_ID: ${{ secrets.NSELF_DISPATCH_APP_ID }}
          APP_KEY: ${{ secrets.NSELF_DISPATCH_APP_PRIVATE_KEY }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Generate GitHub App token
        id: app-token
        if: ${{ steps.app-check.outputs.skip == 'false' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.NSELF_DISPATCH_APP_ID }}
          private-key: ${{ secrets.NSELF_DISPATCH_APP_PRIVATE_KEY }}
          repositories: cli

      - name: Checkout (for pci-send)
        if: ${{ steps.app-check.outputs.skip == 'false' }}
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install nself CLI (for pci-send script)
        if: ${{ steps.app-check.outputs.skip == 'false' }}
        run: |
          curl -fsSL https://install.nself.org | bash || true
          echo "$HOME/.nself/bin" >> $GITHUB_PATH

      - name: Write PCI inbox message
        if: ${{ steps.app-check.outputs.skip == 'false' }}
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          SLUG="ci-fail-$(echo "$REPO" | tr '/' '-')-$RUN_ID"
          TIMESTAMP=$(date -u '+%Y-%m-%d')
          MSG_FILE="msg-${TIMESTAMP}-${SLUG}.md"

          mkdir -p /tmp/pci-out
          cat > "/tmp/pci-out/${MSG_FILE}" <<BODY
          ---
          subject: CI FAILURE: ${WORKFLOW_NAME} on ${REPO}@${HEAD_BRANCH}
          from: ci-failure-pci@nself-org
          to: nself-ppi
          date: $(date -u '+%Y-%m-%dT%H:%M:%SZ')
          priority: high
          type: bug
          ---

          ## Context

          Automated CI failure report. Workflow **${WORKFLOW_NAME}** failed on \`${HEAD_BRANCH}\`
          in repo \`${REPO}\`.

          ## Request

          Triage and fix the CI failure. This is a P1 per the CI-CD-Green Hard Rule.

          ## Details

          - **Repo:** ${REPO}
          - **Workflow:** ${WORKFLOW_NAME}
          - **Branch:** ${HEAD_BRANCH}
          - **SHA:** ${HEAD_SHA}
          - **Run ID:** ${RUN_ID}
          - **Run URL:** ${WORKFLOW_URL}

          ## Impact

          main is red. New PRs cannot merge until this is resolved.
          BODY

          # Copy to nself PPI inbox
          cp "/tmp/pci-out/${MSG_FILE}" \
            "${GITHUB_WORKSPACE}/../../../nself/.claude/inbox/${MSG_FILE}" 2>/dev/null || true

          echo "PCI written: ${MSG_FILE}"
          cat "/tmp/pci-out/${MSG_FILE}"
