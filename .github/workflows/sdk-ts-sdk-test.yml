name: SDK ts-sdk Tests

# Guards @nself/sdk (sdk/ts-sdk): the frozen install the publish workflow runs
# on every tag. A Dependabot bump that regenerates pnpm-lock.yaml without the
# package.json pnpm.overrides block fails here (ERR_PNPM_LOCKFILE_CONFIG_MISMATCH)
# instead of at the next release tag (D-1208).

on:
  push:
    paths:
      - 'sdk/ts-sdk/**'
      - '.github/workflows/sdk-ts-sdk-test.yml'
  pull_request:
    paths:
      - 'sdk/ts-sdk/**'
      - '.github/workflows/sdk-ts-sdk-test.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-ts-sdk:
    name: ts-sdk frozen install + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20'

      - name: Install dependencies (frozen, as the publish workflow does)
        working-directory: sdk/ts-sdk
        run: pnpm install --frozen-lockfile

      - name: Type-check
        working-directory: sdk/ts-sdk
        run: pnpm run typecheck

      - name: Tests
        working-directory: sdk/ts-sdk
        run: pnpm test
