name: Proxy swap e2e

on:
  workflow_dispatch:
    inputs:
      leg:
        description: Proxy swap leg
        type: choice
        options:
          - add
          - round-trip
          - renew
        default: add
      plugins_ref:
        description: Plugins checkout revision
        type: string
        default: bfa72fc66c6f390792f85215b4e91a96599e449c
  pull_request:
    paths:
      - internal/build/proxy*
      - internal/build/orchestrator_nginx.go
      - internal/build/orchestrator_compose.go
      - internal/build/orchestrator_build_compose.go
      - internal/build/nginx_sites_prune.go
      - internal/nginx/**
      - internal/compose/generator.go
      - internal/compose/proxy_omit*
      - scripts/e2e/**
      - cmd/commands/bundle_reconcile*.go
      - cmd/commands/ssl_acme*.go
      - internal/ssl/acme/**
      - internal/docker/run_oneshot*
      - .github/workflows/proxy-swap-e2e.yml

permissions:
  contents: read

jobs:
  proxy-swap:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PLUGINS_DIR: ${{ github.workspace }}/.e2e-plugins
      PLUGINS_REF: ${{ inputs.plugins_ref || 'bfa72fc66c6f390792f85215b4e91a96599e449c' }}
      E2E_EVIDENCE: ${{ github.workspace }}/.e2e-evidence/proxy-swap
    steps:
      - name: Checkout CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout plugins
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nself-org/plugins
          ref: ${{ env.PLUGINS_REF }}
          path: .e2e-plugins
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Harness regression tests
        run: |
          python3 scripts/e2e/proxy-swap-kill_test.py
          python3 scripts/e2e/proxy-swap-workflow_test.py
      - name: Add leg
        if: ${{ github.event_name == 'pull_request' || inputs.leg == 'add' }}
        run: bash scripts/e2e/proxy-swap.sh --add
      - name: Round-trip leg
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.leg == 'round-trip') }}
        run: bash scripts/e2e/proxy-swap.sh --round-trip --assert-identical
      - name: Kill-mid-remove leg
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.leg == 'round-trip') }}
        run: bash scripts/e2e/proxy-swap.sh --kill-mid-remove
      - name: Renew leg
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.leg == 'renew') }}
        run: bash scripts/e2e/proxy-swap.sh --renew
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proxy-swap-evidence
          path: ${{ env.E2E_EVIDENCE }}
          if-no-files-found: warn
          retention-days: 14
