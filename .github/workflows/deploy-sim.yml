name: Deploy simulation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - internal/controlplane/**
      - internal/deploy/**
      - internal/docker/**
      - cmd/commands/deploy*.go
      - .github/workflows/deploy-sim.yml

jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Control plane Docker sshd simulation
        run: INTEGRATION=1 go test -mod=vendor -tags integration -count=1 ./internal/controlplane/sim/...
      - name: Deploy command integration
        run: INTEGRATION=1 go test -mod=vendor -tags integration -count=1 -run 'Deploy.*Integration' ./cmd/commands/
