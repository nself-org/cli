name: Go Vulnerability Check

on:
  pull_request:
    paths: &go-vuln-paths
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "vendor/**"
      - ".github/workflows/govuln.yml"
      - ".github/scripts/govuln-gate.sh"
  schedule:
    - cron: "0 8 * * *"
  push:
    branches: [main]
    paths: *go-vuln-paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: bash .github/scripts/go-install-retry.sh golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Run govulncheck (allowlist gate)
        env:
          GOFLAGS: -mod=vendor
        run: bash .github/scripts/govuln-gate.sh
