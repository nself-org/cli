name: SDK Python Publish

# USER ACTION REQUIRED:
#   Option A — PyPI Trusted Publisher (recommended, no long-lived secret):
#     Configure OIDC Trusted Publisher at https://pypi.org/manage/account/publishing/
#     with: owner=nself-org, repo=cli, workflow=sdk-py-publish.yml, environment=pypi.
#     No secret required when using Trusted Publisher.
#   Option B — API token:
#     Set PYPI_API_TOKEN in GitHub org secrets (github.com/organizations/nself-org/settings/secrets/actions):
#     PYPI_API_TOKEN — PyPI API token from https://pypi.org/manage/account/token/
#   Without either option configured, this workflow skips publish steps gracefully (no-op success).
#
# Triggers on:
#   - cli release tag (v*)             — publishes SDK in lockstep with CLI
#   - sdk-scoped tag (cli-sdk-py/v*)   — publishes SDK only (out-of-band patches)
#   - workflow_dispatch                — manual publish with explicit version input
#
# Auth: PyPI Trusted Publisher OIDC — no PYPI_API_TOKEN secret required.
# Configure the trusted publisher at https://pypi.org/manage/account/publishing/
# with: owner=nself-org, repo=cli, workflow=sdk-py-publish.yml

on:
  push:
    tags:
      - 'v*'
      - 'cli-sdk-py/v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.12). Leave blank to use sdk/py version.'
        required: false
        type: string

permissions:
  id-token: write  # required for OIDC token exchange with PyPI
  contents: read

# cancel-in-progress: false — this workflow deploys/publishes/releases; a superseding
# run must queue behind an in-flight one, never cancel it mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-secret:
    name: Check PyPI secret availability
    runs-on: ubuntu-latest
    outputs:
      has-token: ${{ steps.check.outputs.has-token }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        # Outputs 'true' only when the secret is non-empty.
        # This indirection is required because secrets are not accessible
        # in job-level if conditions directly.
        run: |
          if [ -n "${TOKEN}" ]; then
            echo "has-token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PYPI_API_TOKEN not set — skipping PyPI publish."
            echo "::notice::To enable: add PYPI_API_TOKEN to repo secrets or configure OIDC Trusted Publisher at https://pypi.org/manage/account/publishing/"
          fi

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check-secret]
    if: needs.check-secret.outputs.has-token == 'true'
    environment:
      name: pypi
      url: https://pypi.org/p/nself-sdk
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Override version (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: |
          sed -i "s/^version = .*/version = \"${{ inputs.version }}\"/" sdk/py/pyproject.toml
      - name: Build
        run: |
          cd sdk/py
          pip install --upgrade pip build twine
          python -m build
      - name: Publish to PyPI (token, retry up to 3x)
        # This job only runs when PYPI_API_TOKEN is present (needs.check-secret
        # gate), so twine-with-token is the primary and only method. The OIDC
        # trusted-publisher action was removed: it is not configured on PyPI
        # (owner/repo/workflow trusted publisher), so it failed the job even
        # though the token upload succeeded. skip-existing makes re-runs of an
        # already-published version a no-op success.
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          # Bounded retry: up to 2 additional attempts (total 3), 30s/60s backoff.
          cd sdk/py
          attempt=1
          delay=30
          until python -m twine upload --skip-existing dist/*; do
            if [ "$attempt" -ge 2 ]; then
              echo "Retry publish failed after $attempt additional attempts."
              exit 1
            fi
            echo "Retry attempt $attempt failed. Waiting ${delay}s..."
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done
