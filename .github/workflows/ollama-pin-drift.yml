name: Ollama Installer Pin Drift Monitor

# Weekly check that the pinned SHA-256 in ollama_checksums.go still matches
# the live https://ollama.com/install.sh. When Ollama ships a new installer
# the hashes diverge — this workflow opens an issue so the pin can be updated
# before users hit the fail-loud checksum gate.
#
# This is a drift MONITOR, not a required PR gate. It does not block merges.
# Manual trigger available for on-demand checks (e.g. after an Ollama release).

on:
  schedule:
    - cron: "0 8 * * 1"  # every Monday at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ollama-pin-drift
  cancel-in-progress: true

jobs:
  check:
    name: Compare pinned SHA vs live installer
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Extract pinned SHA from source
        id: pinned
        run: |
          # Parse the string value from the map literal in ollama_checksums.go.
          # Format: "1.0.3": "25f64b810b..."
          pinned=$(grep -oP '(?<=: ")[0-9a-f]{64}(?=")' \
            internal/installer/ollama_checksums.go | head -1)
          if [ -z "$pinned" ]; then
            echo "ERROR: could not extract pinned SHA from ollama_checksums.go" >&2
            exit 1
          fi
          echo "sha=$pinned" >> "$GITHUB_OUTPUT"
          echo "Pinned SHA: $pinned"

      - name: Fetch live installer and compute SHA
        id: live
        run: |
          live=$(curl -fsSL https://ollama.com/install.sh | sha256sum | awk '{print $1}')
          if [ -z "$live" ]; then
            echo "ERROR: could not fetch or hash https://ollama.com/install.sh" >&2
            exit 1
          fi
          echo "sha=$live" >> "$GITHUB_OUTPUT"
          echo "Live SHA:   $live"

      - name: Compare and report
        id: compare
        run: |
          pinned="${{ steps.pinned.outputs.sha }}"
          live="${{ steps.live.outputs.sha }}"
          if [ "$pinned" = "$live" ]; then
            echo "match=true" >> "$GITHUB_OUTPUT"
            echo "PASS: pinned SHA matches live installer."
          else
            echo "match=false" >> "$GITHUB_OUTPUT"
            echo "DRIFT DETECTED: pinned=$pinned live=$live"
          fi

      - name: Open issue on drift
        if: steps.compare.outputs.match == 'false'
        uses: actions/github-script@v9
        env:
          PINNED_SHA: ${{ steps.pinned.outputs.sha }}
          LIVE_SHA: ${{ steps.live.outputs.sha }}
        with:
          script: |
            const pinned = process.env.PINNED_SHA;
            const live   = process.env.LIVE_SHA;
            const date   = new Date().toISOString().slice(0, 10);
            const title  = `[security] Ollama installer pin drift detected ${date}`;
            const body = [
              '## Ollama installer SHA mismatch',
              '',
              'The weekly pin-drift monitor detected that the live `https://ollama.com/install.sh`',
              'no longer matches the value pinned in `internal/installer/ollama_checksums.go`.',
              '',
              '| | SHA-256 |',
              '|---|---|',
              `| Pinned | \`${pinned}\` |`,
              `| Live   | \`${live}\` |`,
              '',
              '### Required action',
              '',
              '1. Manually verify the live installer is a legitimate Ollama release (check',
              '   https://ollama.com and the official GitHub release notes).',
              '2. If the update is legitimate, update `PinnedOllamaInstallSHA256` in',
              '   `internal/installer/ollama_checksums.go` to the new hash and bump',
              '   `DefaultChecksumVersion` to the current CLI version.',
              '3. Re-run `go test -mod=vendor ./internal/installer/...` to confirm the',
              '   pin is non-empty and valid.',
              '4. Open a PR with the updated checksum. CI will verify it before merge.',
              '',
              '### Do not ship a CLI release until this is resolved.',
              '',
              `Detected by: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            // Avoid duplicate open issues.
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,ollama-pin-drift',
            });
            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body: `Pin drift still present on ${date}.\n\nPinned: \`${pinned}\`\nLive: \`${live}\``,
              });
              core.warning(`Drift persists — comment added to existing issue #${existing[0].number}`);
              return;
            }
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['security', 'ollama-pin-drift'],
            });
            core.warning(`Pin drift issue opened: ${issue.html_url}`);

      - name: Fail on drift
        if: steps.compare.outputs.match == 'false'
        run: |
          echo "FAIL: Ollama installer pin has drifted. See opened issue for remediation steps."
          exit 1
