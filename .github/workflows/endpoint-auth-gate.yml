name: Endpoint Auth Gate

# Gates the endpoint-auth-checker tool itself: unit tests plus a self-check on
# the tool's own fixtures (compliant 0, noncompliant 1, missing directory 2).
#
# Scope, stated plainly: a green run means the checker works. It does NOT mean
# cli's own HTTP routes (for example internal/cmd/ci/serve.go and
# sdk/go/server/server.go) are auth-gated; they are not scanned here. The
# checker's allowlist encodes plugin middleware names (RequireLicenseKey and
# friends), and run over real trees it reports thousands of false positives
# (header lookups read as routes), so a red scan gate would be noise. Route-auth
# enforcement for the plugin repos and cli's own servers belongs to the plugin
# conformance work (P7-PLUG), tracked as debt, not to this workflow.

on:
  pull_request:
    paths:
      - 'tools/endpoint-auth-checker/**'
      - '.github/workflows/endpoint-auth-gate.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/endpoint-auth-checker/**'
      - '.github/workflows/endpoint-auth-gate.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-gate:
    name: Endpoint Auth Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        working-directory: tools/endpoint-auth-checker
        run: go test ./... -count=1

      - name: Build checker
        run: go build -o "$RUNNER_TEMP/endpoint-auth-checker" ./tools/endpoint-auth-checker/

      - name: Self-check compliant fixture (expect exit 0)
        run: |
          "$RUNNER_TEMP/endpoint-auth-checker" \
            --dirs tools/endpoint-auth-checker/testdata/compliant_plugin/ \
            --fail-on-unknown

      - name: Self-check noncompliant fixture (expect exit 1)
        run: |
          set +e
          "$RUNNER_TEMP/endpoint-auth-checker" \
            --dirs tools/endpoint-auth-checker/testdata/noncompliant_plugin/ \
            --fail-on-unknown
          test $? -eq 1

      - name: Self-check missing directory (expect exit 2)
        run: |
          set +e
          "$RUNNER_TEMP/endpoint-auth-checker" \
            --dirs tools/endpoint-auth-checker/testdata/does-not-exist/ \
            --fail-on-unknown
          test $? -eq 2
