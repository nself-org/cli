name: Docker Multi-Arch Publish

# USER ACTION REQUIRED:
#   Set the following secrets in GitHub org secrets (github.com/organizations/nself-org/settings/secrets/actions):
#     DOCKER_HUB_TOKEN    — Docker Hub access token (https://hub.docker.com/settings/security)
#     DOCKER_HUB_USERNAME — Docker Hub username (typically "nself")
#   Without these secrets, this workflow will skip the publish steps gracefully (no-op success).
#
# Triggers on:
#   - GitHub Release published (includes pre-releases)
#   - workflow_dispatch — manual publish with optional version override
#
# Tags published:
#   nself/nself:<version>   (e.g. nself/nself:1.1.1)
#   nself/nself:latest      (on non-pre-release)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (e.g. 1.1.1). Blank = use release tag.'
        required: false
        type: string

permissions:
  contents: read

# cancel-in-progress: false — this workflow deploys/publishes/releases; a superseding
# run must queue behind an in-flight one, never cancel it mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    name: Build and push multi-arch Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      # Preflight: skip gracefully when Docker Hub secrets are absent.
      # secrets context is only valid inside a step env: block — never in job-level if:.
      - name: Preflight (Docker Hub secrets present)
        id: preflight
        env:
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "${DOCKER_HUB_TOKEN}" ] || [ -z "${DOCKER_HUB_USERNAME}" ]; then
            # A manual dispatch is an explicit intent to publish, so a silent
            # skip there is a lie: the job would report success having pushed
            # nothing. That is exactly how nself/nself went unpublished from
            # v1.2.0 (2026-07-01) to v1.4.0 without a single red check.
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "::error::DOCKERHUB_TOKEN or DOCKERHUB_USERNAME not available to this workflow."
              echo "::error::They exist as nself-org organisation secrets visible to all repos."
              exit 1
            fi
            echo "::notice::DOCKERHUB_TOKEN or DOCKERHUB_USERNAME not set — skipping Docker publish."
            echo "::notice::Set both secrets in GitHub org settings to enable Docker Hub publishing."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve version
        id: version
        if: steps.preflight.outputs.proceed == 'true'
        run: |
          # workflow_dispatch input takes precedence; fall back to release tag
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "${VERSION}" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          fi
          # Strip leading 'v'
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

          # Tag as latest only for non-pre-release
          IS_PRERELEASE="${{ github.event.release.prerelease }}"
          if [ "${IS_PRERELEASE}" = "true" ]; then
            echo "latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU (multi-arch emulation)
        if: steps.preflight.outputs.proceed == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.preflight.outputs.proceed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: steps.preflight.outputs.proceed == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (amd64 + arm64, versioned tag)
        if: steps.preflight.outputs.proceed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: nself/nself:${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.date }}
            NSELF_LICENSE_PUBKEY_HEX=${{ secrets.NSELF_LICENSE_PUBKEY_HEX }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag as latest
        if: steps.preflight.outputs.proceed == 'true' && steps.version.outputs.latest == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: nself/nself:latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.date }}
            NSELF_LICENSE_PUBKEY_HEX=${{ secrets.NSELF_LICENSE_PUBKEY_HEX }}
          cache-from: type=gha

      - name: Summary
        if: steps.preflight.outputs.proceed == 'true'
        run: |
          echo "### Docker publish complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`nself/nself:${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.version.outputs.latest }}" = "true" ]; then
            echo "- Also tagged: \`nself/nself:latest\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Platforms: linux/amd64, linux/arm64" >> "$GITHUB_STEP_SUMMARY"
