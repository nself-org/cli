name: Docker Multi-Arch Publish

# Publishes nself/nself after every successful Release run (P7-HYG-06, EPIC H6).
#
# Secrets (nself-org organisation secrets, visible to this repo):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, NSELF_LICENSE_PUBKEY_HEX
# With either Docker Hub secret absent the job FAILS on every event; there is no
# skip path (a green run that pushed nothing hid an unpublished image for months).
#
# Triggers:
#   - workflow_run: workflow `Release` completed. The job runs only when that run
#     concluded success, so a tag whose release failed never gets an image. A
#     `release: published` trigger never fires for releases created with
#     GITHUB_TOKEN, which is why it was replaced.
#   - workflow_dispatch: manual publish of a given release version (blank = GitHub's
#     latest release). This is also the backfill path.
#
# Version, :latest and the go/no-go all come from scripts/ci/docker-publish-version.sh
# (tested by scripts/ci/docker-publish-version_test.sh). A tag must have a GitHub
# release; :latest only for a non-prerelease that is GitHub's latest release.
#
# Tags published:
#   nself/nself:<version>   (e.g. nself/nself:1.4.13)
#   nself/nself:latest      (non-prerelease, GitHub's latest only; promoted by the
#                            serialised promote-latest job via `imagetools create`,
#                            no rebuild, after re-checking the latest release)

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish (e.g. 1.4.13). Blank = GitHub''s latest release.'
        required: false
        type: string

permissions:
  contents: read

# cancel-in-progress: false — this workflow deploys/publishes/releases; a superseding
# run must queue behind an in-flight one, never cancel it mid-flight.
concurrency:
  # D-0204: key on the normalised release tag (always v<ver>) so a dispatch with
  # or without the leading v serialises with the matching workflow_run. Blank
  # dispatch input falls through to github.ref (the default branch), never "".
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || (github.event_name == 'workflow_dispatch' && inputs.version != '' && (startsWith(inputs.version, 'v') && inputs.version || format('v{0}', inputs.version))) || github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  docker:
    name: Build and push multi-arch Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # workflow_run fires for failed Release runs too; only a success publishes.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      latest: ${{ steps.version.outputs.latest }}

    steps:
      - uses: actions/checkout@v7.0.1

      # Single source of proceed/version/latest. Fails closed: secrets absent, a
      # non-tag head_branch, a tag with no GitHub release, or a failed Release
      # run all exit 1. The secrets context is only valid in a step env, so the
      # presence check is an expression; no secret value reaches the shell.
      - name: Resolve version and preflight
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          HAVE_SECRETS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' && '1' || '0' }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/docker-publish-version.sh

      # workflow_run checks out the default branch, not the tag. Build the tag's
      # own source so the image matches the release.
      - name: Check out the release tag
        id: source
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
          git checkout --detach "refs/tags/${TAG}"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (amd64 + arm64, versioned tag)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: nself/nself:${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.source.outputs.commit }}
            BUILD_DATE=${{ steps.source.outputs.date }}
            NSELF_LICENSE_PUBKEY_HEX=${{ secrets.NSELF_LICENSE_PUBKEY_HEX }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Docker publish complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`nself/nself:${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.version.outputs.latest }}" = "true" ]; then
            echo "- \`nself/nself:latest\`: promoted by the promote-latest job if this is still the latest release" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Platforms: linux/amd64, linux/arm64" >> "$GITHUB_STEP_SUMMARY"

  # :latest is a second name for the versioned index, not a second build: the
  # same platform manifests and the same provenance attestations, so both tags
  # report one index digest (D-0351). It is a separate job because the per-tag
  # group above lets two releases publish at once, and `latest` was resolved
  # before the build: an older run finishing last would move :latest backwards.
  # Every promotion shares ONE group, so they run one at a time, and the script
  # re-reads GitHub's latest release inside the lock before it writes. Retain
  # pending promotions: an older build finishing later must not replace the
  # newest release's pending promotion. GitHub queues up to 100 with queue: max.
  promote-latest:
    name: Promote nself/nself:latest
    needs: docker
    if: needs.docker.outputs.latest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: docker-publish-latest
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag as latest if still the latest release
        env:
          TAG: ${{ needs.docker.outputs.tag }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/docker-publish-promote.sh
