name: SDK Version Sync

# Verify all SDK versions are pinned to the CLI release tag.
# Runs on every push to main, PRs, and on release tag pushes.
# Fails CI if any SDK manifest version does not match the CLI VERSION file
# (or, on a tag push, the tag value).
#
# Source of truth: .github/VERSION
# Manifests checked:
#   sdk/go/doc.go                        (const Version = "X.Y.Z")
#   sdk/py/pyproject.toml                (version = "X.Y.Z")
#   sdk/ts/package.json                  ("version": "X.Y.Z")
#   sdk/ts-sdk/package.json              ("version": "X.Y.Z")
#   sdk/ts-cli-api/package.json          ("version": "X.Y.Z")

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/VERSION'
      - 'sdk/**/pyproject.toml'
      - 'sdk/**/package.json'
      - 'sdk/go/doc.go'
      - '.github/workflows/sdk-version-sync.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  version-sync:
    name: Verify SDK versions match CLI tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Resolve target version
        id: target
        run: |
          # On tag push, take version from the tag (strip leading "v").
          # Otherwise, take version from .github/VERSION.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TARGET="${GITHUB_REF#refs/tags/v}"
            echo "Source: tag ${GITHUB_REF}"
          else
            TARGET="$(cat .github/VERSION)"
            echo "Source: VERSION file"
          fi
          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"
          echo "Target version: ${TARGET}"

      - name: Verify Go SDK version (sdk/go/doc.go)
        run: |
          TARGET='${{ steps.target.outputs.target }}'
          GO_V=$(grep -E '^const Version = "[^"]+"' sdk/go/doc.go | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Go SDK declared: ${GO_V}"
          if [ "${GO_V}" != "${TARGET}" ]; then
            echo "MISMATCH: Go SDK is ${GO_V}, expected ${TARGET}"
            exit 1
          fi

      - name: Verify Python SDK version (sdk/py/pyproject.toml)
        run: |
          TARGET='${{ steps.target.outputs.target }}'
          PY_V=$(grep -E '^version = "[^"]+"' sdk/py/pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Python SDK declared: ${PY_V}"
          if [ "${PY_V}" != "${TARGET}" ]; then
            echo "MISMATCH: Python SDK is ${PY_V}, expected ${TARGET}"
            exit 1
          fi

      - name: Verify TypeScript SDK version (sdk/ts/package.json)
        run: |
          TARGET='${{ steps.target.outputs.target }}'
          TS_V=$(node -p "require('./sdk/ts/package.json').version")
          echo "TS SDK declared: ${TS_V}"
          if [ "${TS_V}" != "${TARGET}" ]; then
            echo "MISMATCH: TS SDK is ${TS_V}, expected ${TARGET}"
            exit 1
          fi

      - name: Verify every sdk npm package version (sdk/*/package.json)
        run: |
          TARGET='${{ steps.target.outputs.target }}'
          # Globbed, not listed: a package missing from a hand-kept list was skipped by the bumper.
          for pkg in sdk/*/package.json; do
            dir="${pkg%/package.json}"
            V=$(node -p "require('./${pkg}').version")
            echo "${dir} declared: ${V}"
            if [ "${V}" != "${TARGET}" ]; then
              echo "MISMATCH: ${dir} is ${V}, expected ${TARGET}"
              exit 1
            fi
          done

      - name: Summary
        run: |
          echo "All SDK manifests at version ${{ steps.target.outputs.target }}"
