name: Nightly Security Audit (govulncheck)

# G8-T02 P97 W37 — nightly govulncheck for the CLI binary.
# Runs at 04:00 UTC daily; fails on any HIGH/CRITICAL Go vuln and opens
# a tracking issue so the run cannot be silently ignored.
#
# Complements .github/workflows/govuln.yml (08:00 UTC PR + push gate).
# Different cron + dedicated escalation path keeps nightly green visible.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/govulncheck-nightly.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  govulncheck:
    name: govulncheck (HIGH/CRITICAL gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: bash .github/scripts/go-install-retry.sh golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Run govulncheck (JSON)
        id: scan
        env:
          GOFLAGS: -mod=vendor
        run: |
          set +e
          govulncheck -json ./... > govuln.json
          STATUS=$?
          set -e

          if [ ! -s govuln.json ]; then
            echo "govulncheck produced no JSON output (status=$STATUS)"
            echo "findings=0" >> "$GITHUB_OUTPUT"
            exit "$STATUS"
          fi

          # Distinct OSV vulnerability IDs that resolve to actual call-graph hits.
          jq -r '
            select(.finding != null)
            | .finding
            | select(.trace != null and (.trace | length) > 0)
            | .osv
          ' govuln.json 2>/dev/null | sort -u > "${RUNNER_TEMP}/all-osv.txt"

          # Accepted advisories: same source of truth as govuln.yml.
          sed 's/#.*//' .github/govulncheck-allow.txt \
            | grep -oE 'GO-[0-9]{4}-[0-9]+' | sort -u > "${RUNNER_TEMP}/allow-osv.txt"

          comm -23 "${RUNNER_TEMP}/all-osv.txt" "${RUNNER_TEMP}/allow-osv.txt" \
            > "${RUNNER_TEMP}/unexpected-osv.txt"
          FINDINGS=$(grep -c . "${RUNNER_TEMP}/unexpected-osv.txt" || true)
          TOTAL=$(grep -c . "${RUNNER_TEMP}/all-osv.txt" || true)

          echo "findings=$FINDINGS" >> "$GITHUB_OUTPUT"
          echo "::notice::govulncheck call-graph findings: ${TOTAL} total, ${FINDINGS} unexpected"

          if [ "$FINDINGS" -gt 0 ]; then
            echo "::error::Reachable Go vulnerabilities not in .github/govulncheck-allow.txt — failing build"
            sed 's/^/- /' "${RUNNER_TEMP}/unexpected-osv.txt"
            exit 1
          fi

      - name: Upload scan artifact
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: govuln-${{ github.run_id }}
          path: govuln.json
          retention-days: 30

      - name: Open tracking issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const findings = '${{ steps.scan.outputs.findings }}';
            const title = `Nightly govulncheck: ${findings} reachable Go vuln(s)`;
            const body = [
              `Nightly govulncheck on \`main\` flagged reachable HIGH/CRITICAL Go vulnerabilities.`,
              ``,
              `- Reachable findings (call-graph hits): ${findings}`,
              ``,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `Scan output attached as artifact \`govuln-${context.runId}\`.`,
              ``,
              `Action: bump vulnerable modules in \`go.mod\`, run \`go mod vendor\`, verify locally with \`govulncheck ./...\`.`,
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,govulncheck-nightly',
            });
            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['security', 'govulncheck-nightly'],
            });
