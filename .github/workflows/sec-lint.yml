name: Security Lint

on:
  push:
    branches: [main]
    paths: &sec-lint-paths
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "scripts/sec-lint.sh"
      - ".github/workflows/sec-lint.yml"
  pull_request:
    paths: *sec-lint-paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sec-lint:
    name: Security Lint (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Run security lint
        run: bash scripts/sec-lint.sh internal

  ci-masking-lint:
    name: CI-masking lint (continue-on-error justification)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # P6-E11-W2-S3-T15: regression check for the estate-wide CI-masking
    # sweep — fails if any workflow adds continue-on-error: true without the
    # ACCEPTED/Expiry comment documented in
    # .claude/docs/doctrines/ci-cd-green.md § The ACCEPTED/Expiry Exception Pattern.

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Run CI-masking lint
        run: bash scripts/ci-masking-lint.sh
