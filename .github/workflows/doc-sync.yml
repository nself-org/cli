name: Doc-Sync Ritual

# Enforces the Doc-Sync Ritual (P93 Theme 27).
# Doctrine: https://github.com/nself-org/ — ~/Sites/nself/.claude/docs/doctrines/doc-sync-ritual.md
# Blocks any PR that changes a user-visible surface without matching doc updates.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # CLI-R08: the wiki is generated from the cobra tree, so a command can no
  # longer ship without a page, a sidebar entry and an llms.txt row. This job
  # fails when the committed pages are stale or when any [[link]] dangles.
  wiki-generated:
    name: wiki is generated and links resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Wiki pages are current
        run: CGO_ENABLED=0 go run -mod=vendor ./tools/wikigen -check

      - name: Wiki links resolve
        run: bash scripts/ci/wiki-link-audit.sh

      # Catches a documented/scripted `nself <path> --flag` whose flag was
      # never registered on the command it names (the --quick regression
      # that PR #258 fixed went undetected for over a month; see the script
      # header for the full story). Commands the core binary doesn't
      # register at all (plugin-provided) are reported, never failed on.
      - name: Documented/scripted flags resolve against the binary
        run: bash scripts/ci/flag-drift-audit.sh

      - name: Command inventory is current
        run: |
          CGO_ENABLED=0 go run -mod=vendor ./tools/cmdinventory -format json -depth 2 > /tmp/inventory.json
          diff -u .github/command-inventory.json /tmp/inventory.json

      # CLI-R17: the four-surface parity matrix (wiki page, MCP tool, env var
      # docs, OpenAPI route) is generated by tools/parity from the same
      # command-inventory.json this job already verified above. -check fails
      # if the committed .github/surface-parity.{md,json} are stale.
      - name: Parity matrix is current
        run: CGO_ENABLED=0 go run -mod=vendor ./tools/parity -check

      # Docs are the minimum bar: a command with no wiki page fails the build.
      # (wiki-generated above already guarantees every command gets a page, so
      # this is a second, independent gate on the same fact via the matrix.)
      - name: Parity gate — every command has a wiki page
        run: |
          missing=$(jq -r '[.rows[] | select(.wiki_page == false) | .name] | length' .github/surface-parity.json)
          if [ "$missing" -ne 0 ]; then
            jq -r '.rows[] | select(.wiki_page == false) | "::error::" + .path + " has no wiki page"' .github/surface-parity.json
            echo "::error::$missing command(s) missing a wiki page — see .github/surface-parity.md"
            exit 1
          fi
          echo "All commands have a wiki page."

      # The other three columns are informational, not release blockers: MCP
      # tool coverage and OpenAPI routes are additive surfaces, and the env
      # var check is a deliberate under-count (see tools/parity/envvars.go).
      # Report the gaps as build annotations without failing the job.
      - name: Parity soft columns (informational)
        run: |
          no_mcp=$(jq -r '[.rows[] | select(.mcp_tool == false)] | length' .github/surface-parity.json)
          undoc_env=$(jq -r '[.rows[] | select(.env_vars | startswith("undocumented"))] | length' .github/surface-parity.json)
          echo "::warning::$no_mcp/$(jq -r '.rows | length' .github/surface-parity.json) commands have no matching MCP tool"
          echo "::warning::$undoc_env commands read an env var not documented in Config-Env-Vars.md"
          echo "OpenAPI Route column is n/a for all commands — no route source exists in this repo yet."

  doc-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The commands/flags rule below used to fire on ANY file under cmd/,
      # which cannot distinguish "added a flag" from "added a comment". It
      # false-failed a PR that only added //nolint annotations. The generators
      # are authoritative: if they produce no diff, the docs are in sync, full
      # stop. Run them and record the answer.
      - name: Check generated command docs for real drift
        id: cmddrift
        run: |
          make cmd-inventory >/dev/null 2>&1 || true
          make wiki-commands >/dev/null 2>&1 || true
          if [ -n "$(git status --porcelain)" ]; then
            echo "drift=1" >> "$GITHUB_OUTPUT"
            echo "::warning::command docs are stale — run: make cmd-inventory && make wiki-commands"
            git --no-pager diff --stat
          else
            echo "drift=0" >> "$GITHUB_OUTPUT"
          fi
          git checkout -- . 2>/dev/null || true

      - name: Compute PR diff
        id: diff
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD || true)
          echo "changed<<EOF" >> "$GITHUB_OUTPUT"
          echo "$changed" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "$changed"

      - name: Doc-Sync matrix check
        env:
          CHANGED: ${{ steps.diff.outputs.changed }}
          CMD_DRIFT: ${{ steps.cmddrift.outputs.drift }}
        run: |
          set -u
          missing=0
          rows=""

          matches() {
            echo "$CHANGED" | grep -qE "$1"
          }

          # Commands / flags.
          #
          # These patterns were written for a monorepo checkout where this repo
          # sits under cli/. Inside the cli repo itself the paths have no cli/
          # prefix and .wiki/ does not exist (the wiki lives in .github/wiki/),
          # so the rule matched nothing and silently passed on every change.
          # Since CLI-R08 the command pages are GENERATED, and the real gate is
          # the wiki-generated job in this workflow plus the committed
          # .github/command-inventory.json, which CI diffs. Point the rule at
          # the artifacts that actually exist.
          # Only a REAL generator diff counts. A path match alone means someone
          # touched a file under cmd/ — which is true of a comment, a test, or a
          # refactor that changes no command surface at all.
          if [ "${CMD_DRIFT:-0}" = "1" ]; then
            if ! matches '^((cli/)?\.github/wiki/cmd-|(cli/)?\.github/command-inventory\.json|(cli/)?\.github/wiki/Commands\.md|\.claude/docs/sport/F02-COMMAND-INVENTORY\.md|web/docs/content/cli/)'; then
              rows="${rows}- commands/flags changed without a .github/wiki/cmd-*.md or command-inventory.json update (run: make cmd-inventory && make wiki-commands)\n"
              missing=1
            fi
          fi

          # Env vars.
          #
          # The .env.example clause deliberately does NOT match test fixtures.
          # cmd/commands/.env.example is a tracked fixture, not a user-facing
          # template, and a test that rewrites it should be fixed rather than
          # papered over with a docs edit.
          # Test fixture templates are not public configuration inventory.
          env_changes=$(printf '%s\n' "$CHANGED" | grep -E '(^|/)\.env\.example$|^(cli/)?internal/(env|config)/' | grep -vE '^(cli/)?cmd/commands/testdata/' || true)
          if [ -n "$env_changes" ]; then
            if matches '^(cli/)?cmd/commands/\.env\.example$'; then
              echo "::warning::cmd/commands/.env.example changed — that is a test fixture. If a test rewrote it, fix the test; do not commit the churn."
            fi
            if ! matches '(\.claude/docs/sport/F09-ENV-VAR-INVENTORY\.md|(cli/)?\.github/wiki/reference/env-vars\.md|(cli/)?\.github/wiki/Config-Env-Vars\.md|web/docs/content/reference/env-vars)'; then
              rows="${rows}- env vars changed without F09-ENV-VAR-INVENTORY.md or .github/wiki/Config-Env-Vars.md update\n"
              missing=1
            fi
          fi

          # API endpoints
          if matches '^web/backend/services/|^web/backend/.*/metadata/'; then
            if ! matches '(web/docs/content/api/|\.claude/docs/API-Reference\.md|\.claude/docs/sport/F08-SERVICE-INVENTORY\.md)'; then
              rows="${rows}- API endpoints changed without web/docs/content/api/ or F08-SERVICE-INVENTORY.md update\n"
              missing=1
            fi
          fi

          # UI pages
          if matches '^(admin/app/|web/[^/]+/src/app/)'; then
            if ! matches '(admin/\.wiki/|web/docs/content/|\.github/docs/|\.github/wiki/)'; then
              rows="${rows}- UI pages changed without matching .wiki/ or web/docs/content/ update\n"
              missing=1
            fi
          fi

          # Pricing / tiers
          if matches '^(web/org/content/(pricing|membership)/|web/org/src/.*(pricing|tier)|plugins-pro/.*/tier)'; then
            if ! matches '(\.claude/docs/sport/F07-PRICING-TIERS\.md|\.claude/docs/membership/|web/org/content/(pricing|membership)/)'; then
              rows="${rows}- pricing/tiers changed without F07-PRICING-TIERS.md or membership docs update\n"
              missing=1
            fi
          fi

          # Plugins / bundles
          if matches '^(plugins|plugins-pro)/[^/]+/'; then
            if ! matches '(\.claude/docs/sport/F0[346]-|plugins/README\.md|plugins-pro/README\.md|web/org/content/plugins/|web/docs/content/plugins/)'; then
              rows="${rows}- plugins/bundles changed without F03/F04/F06 or README or web/*/content/plugins/ update\n"
              missing=1
            fi
          fi

          # Ports / subdomains
          # Exclude test fixtures + templates — they are test scaffolding, not
          # user-facing surface. The canonical matcher is production nginx/
          # config and generated docker-compose.yml, not testdata fixtures.
          ports_hit=$(echo "$CHANGED" \
            | grep -E '^(nginx/|.*docker-compose\.ya?ml$)' \
            | grep -vE '(^|/)testdata/' \
            | grep -vE '(^|/)templates/' \
            || true)
          if [ -n "$ports_hit" ]; then
            if ! matches '(\.claude/docs/sport/F10-PORT-REGISTRY\.md|\.claude/docs/sport/F11-SUBDOMAIN-MAP\.md|\.claude/CLAUDE\.md)'; then
              rows="${rows}- ports/subdomains changed without F10-PORT-REGISTRY.md or F11-SUBDOMAIN-MAP.md update\n"
              missing=1
            fi
          fi

          # Versions
          # Exclude sdk/{flutter,py,ts,go} version files — SDK libraries have independent
          # versioning tracked separately from the nSelf product version.
          # Exclude vendor/modules.txt — generated dependency file, not a version manifest.
          version_hit=$(echo "$CHANGED" \
            | grep -E '(^cli/VERSION$|pubspec\.yaml$|homebrew-nself/.*\.rb$|plugins-pro/VERSION$|^Cargo\.toml$)' \
            | grep -vE '^sdk/' \
            | grep -vE '^vendor/' \
            || true)
          if [ -n "$version_hit" ]; then
            if ! matches '(\.claude/docs/MASTER-VERSIONS\.md|\.claude/docs/sport/F01-MASTER-VERSIONS\.md|\.github/wiki/Changelog\.md|web/org/content/changelog|homebrew-nself/Formula/)'; then
              rows="${rows}- version files changed without MASTER-VERSIONS.md or F01 update\n"
              missing=1
            fi
          fi

          if [ "$missing" -eq 1 ]; then
            echo "::error::Doc-Sync Ritual violations detected"
            printf '%b' "$rows"
            echo ""
            echo "Doctrine: .claude/docs/doctrines/doc-sync-ritual.md"
            echo "Matrix:   .claude/qa/pre-commit.md"
            exit 1
          fi

          echo "Doc-Sync Ritual: all surface changes have matching doc updates."
