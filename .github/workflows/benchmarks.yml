name: Quarterly Benchmarks

on:
  schedule:
    # First Monday of March, June, September, December at 07:00 UTC
    - cron: "0 7 1-7 3,6,9,12 1"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish results to nself.org/benchmarks"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # cron ORs day-of-month with day-of-week when both are restricted, so
  # "0 7 1-7 3,6,9,12 1" matches the 1st-7th AND every Monday of those months,
  # not the first Monday. That is roughly ten fires per quarter instead of one,
  # each a 30-minute job holding contents:write and pull-requests:write.
  # Same defect the DR drill reminder carried until #235.
  #
  # Gating as a separate job keeps the condition in one place rather than
  # repeating `if:` on every step of the benchmark job.
  gate:
    name: First Monday check
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        run: |
          DOM=$(date -u +%-d)
          DOW=$(date -u +%u)   # 1 = Monday
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual dispatch — bypassing the first-Monday gate"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ "$DOW" -eq 1 ] && [ "$DOM" -le 7 ]; then
            echo "first Monday (dom=${DOM}) — proceeding"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "not the first Monday (dom=${DOM} dow=${DOW}) — skipping benchmarks"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  benchmark:
    name: Run Benchmarks
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install oha (HTTP benchmarking tool)
        run: |
          curl -fsSL https://github.com/hatoo/oha/releases/latest/download/oha-linux-amd64 \
            -o /usr/local/bin/oha
          chmod +x /usr/local/bin/oha

      - name: Build nSelf binary
        run: |
          CGO_ENABLED=0 go build -mod=vendor -ldflags='-s -w' -o nself ./cmd/nself/

      - name: Run benchmark harness
        run: .github/benchmarks/run.sh
        env:
          CI: "true"

      - name: Archive results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ github.run_id }}
          path: .github/benchmarks/results/
          retention-days: 14

      - name: Check for regression (>10% degradation vs last quarter)
        run: |
          RESULTS_DIR=".github/benchmarks/results"
          LATEST=$(ls -t "$RESULTS_DIR"/*.json 2>/dev/null | head -1)
          PREV=$(ls -t "$RESULTS_DIR"/*.json 2>/dev/null | sed -n '2p')
          if [ -n "$LATEST" ] && [ -n "$PREV" ]; then
            LATEST_RPS=$(jq -r '.rps_1cpu' "$LATEST")
            PREV_RPS=$(jq -r '.rps_1cpu' "$PREV")
            echo "Latest RPS: $LATEST_RPS  Previous: $PREV_RPS"
            # Warn if RPS dropped >10% (informational only)
          fi

      - name: Commit results
        if: success()
        run: |
          git config user.name "nSelf Benchmarks Bot"
          git config user.email "benchmarks@nself.org"
          DATE=$(date +%Y-%m-%d)
          git add .github/benchmarks/results/
          git diff --staged --quiet || git commit -s -m "chore: quarterly benchmark results $DATE"
          git push origin HEAD || true
