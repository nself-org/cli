name: Quarterly Benchmarks

on:
  schedule:
    # First Monday of March, June, September, December at 07:00 UTC
    - cron: "0 7 1-7 3,6,9,12 1"
  workflow_dispatch:

# Read-only: results are workflow artifacts only. This workflow never writes
# to the repository (P7-TRUTH-22, EPIC TRUTH D13).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # cron ORs day-of-month with day-of-week when both are restricted, so
  # "0 7 1-7 3,6,9,12 1" matches the 1st-7th AND every Monday of those months,
  # not the first Monday. That is roughly ten fires per quarter instead of one,
  # each a 30-minute job.
  # Same defect the DR drill reminder carried until #235.
  #
  # Gating as a separate job keeps the condition in one place rather than
  # repeating `if:` on every step of the benchmark job.
  gate:
    name: First Monday check
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        run: |
          DOM=$(date -u +%-d)
          DOW=$(date -u +%u)   # 1 = Monday
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual dispatch — bypassing the first-Monday gate"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ "$DOW" -eq 1 ] && [ "$DOM" -le 7 ]; then
            echo "first Monday (dom=${DOM}) — proceeding"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "not the first Monday (dom=${DOM} dow=${DOW}) — skipping benchmarks"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  benchmark:
    name: Time to healthy
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AI_AUTO_INSTALL: "false"
      GOLDEN_PATH_SOURCE: local
      GOLDEN_PATH_HEALTH_TIMEOUT: "240"
      RESULT_DIR: /tmp/benchmark-results

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify Docker daemon
        run: |
          for i in $(seq 1 15); do
            docker info >/dev/null 2>&1 && echo "Docker ready" && break
            echo "Waiting for Docker... (${i}/15)"
            sleep 2
          done
          docker info

      - name: Harness tests
        run: bash .github/benchmarks/test-harness.sh

      # Builds this ref (GOLDEN_PATH_SOURCE=local) and runs the real 13-step
      # path; the harness reads the report it writes and times nothing itself.
      - name: Run golden path
        env:
          NSELF_PLUGIN_LICENSE_KEY_OWNER: ${{ secrets.NSELF_PLUGIN_LICENSE_KEY_OWNER }}
        run: bash scripts/golden-path.sh

      - name: Measure time to healthy
        if: always()
        run: |
          mkdir -p "$RESULT_DIR"
          if [ ! -f /tmp/golden-path-report.json ]; then
            echo "::error::no golden-path report was produced; nothing to measure"
            exit 1
          fi
          cp /tmp/golden-path-report.json "$RESULT_DIR/golden-path-report.json"
          .github/benchmarks/run.sh /tmp/golden-path-report.json "$RESULT_DIR/time-to-healthy.json"

      - name: Archive results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ github.run_id }}
          path: ${{ env.RESULT_DIR }}
          if-no-files-found: error
          retention-days: 14
