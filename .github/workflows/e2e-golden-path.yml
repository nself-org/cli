name: E2E Golden Path

on:
  schedule:
    # Every Monday 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip real installs)'
        required: false
        default: 'false'
        type: boolean
      source:
        description: 'Which nself to exercise: the published release, or a build of this ref'
        required: false
        default: 'release'
        type: choice
        options: [release, local]

concurrency:
  group: e2e-golden-path
  cancel-in-progress: false

jobs:
  golden-path:
    name: 13-step golden path smoke
    # Moved back to GitHub-hosted ubuntu-latest 2026-08-14: cli is a PUBLIC
    # repo, so hosted runners are free/unlimited and this job must not depend
    # on a single self-hosted box. The 2026-07-07 failure recorded against the
    # self-hosted runner (run 28823997500) predates this change; ubuntu-latest
    # ships a real host Docker daemon (not a docker:dind service container),
    # so the multi-container `nself start` compose stack is expected to work
    # the same way it does on a real dev machine. Watch this job after the
    # cutover — if it still fails at "Starting remaining services", that is a
    # genuine ubuntu-latest Docker limitation to investigate, not the old
    # self-hosted-specific issue.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    env:
      GOLDEN_PATH_SKIP_CLEANUP: '0'
      # Skip the ollama auto-download during `nself start` — a full-stack smoke
      # must not pull multi-GB AI models in CI (that's what destabilized step 5).
      AI_AUTO_INSTALL: 'false'
      GOLDEN_PATH_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
      # Which binary step 1 installs. The scheduled run stays on 'release' on
      # purpose: its job is to prove the PUBLISHED install path works, which is
      # what users actually hit. But that also means a fix to `nself start`
      # cannot be validated here until after it ships, which is backwards for a
      # pre-release gate. Dispatching with source=local builds this ref instead,
      # so a fix can be proven BEFORE it is released.
      GOLDEN_PATH_SOURCE: ${{ github.event.inputs.source || 'release' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go (for any CLI build steps)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Homebrew (Linux)
        run: |
          if ! command -v brew >/dev/null 2>&1; then
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          echo "/home/linuxbrew/.linuxbrew/bin" >> "${GITHUB_PATH}"
          echo "/home/linuxbrew/.linuxbrew/sbin" >> "${GITHUB_PATH}"

      - name: Verify Docker daemon
        run: |
          for i in $(seq 1 15); do
            docker info >/dev/null 2>&1 && echo "Docker ready" && break
            echo "Waiting for Docker... (${i}/15)"
            sleep 2
          done
          docker info

      # Length only, never the value: this tells us whether the secret reached
      # the job at all, which "accepts 1 arg(s), received 0" three steps later
      # does not.
      - name: Check the license secret reached the job
        env:
          NSELF_PLUGIN_LICENSE_KEY_OWNER: ${{ secrets.NSELF_PLUGIN_LICENSE_KEY_OWNER }}
        run: |
          if [ -z "${NSELF_PLUGIN_LICENSE_KEY_OWNER}" ]; then
            echo "NSELF_PLUGIN_LICENSE_KEY_OWNER is EMPTY in this job"
          else
            echo "NSELF_PLUGIN_LICENSE_KEY_OWNER present (${#NSELF_PLUGIN_LICENSE_KEY_OWNER} chars)"
          fi

      - name: Run golden-path smoke
        env:
          NSELF_PLUGIN_LICENSE_KEY_OWNER: ${{ secrets.NSELF_PLUGIN_LICENSE_KEY_OWNER }}
          # A cold runner needs longer than the 60s local default to pull and
          # boot postgres + hasura + auth + nginx (CLI-R05).
          GOLDEN_PATH_HEALTH_TIMEOUT: "240"
        run: bash scripts/golden-path.sh

      # Informational only (EPIC P7-GUARD, G8): time to healthy = sum of the
      # golden-path report's steps 3-6 durations, read from the report the smoke
      # step already wrote, never re-timed. It never gates: the golden path's own
      # per-step thresholds are its gate. `if: always()` so the number is printed
      # even when a later step (today: step 10, claw install) fails the run; when
      # steps 3-6 did not all pass the step says so and exits 0.
      - name: Time to healthy (informational)
        if: always()
        run: |
          if [ -f /tmp/golden-path-report.json ]; then
            # No pipe: the default step shell has no pipefail, so a pipe into tee
            # would hide healthy's exit status.
            # Built, not `go run`: go run reports every non-zero child exit as 1, and
            # this step tells exit 1 (not measurable) from exit 2 (bad report).
            go build -mod=vendor -o /tmp/perfbench ./tools/perfbench
            rc=0
            /tmp/perfbench healthy -report /tmp/golden-path-report.json -json > /tmp/perf-healthy.json || rc=$?
            if [ "$rc" -eq 0 ]; then
              cat /tmp/perf-healthy.json
              TTH=$(python3 -c 'import json; print([m for m in json.load(open("/tmp/perf-healthy.json"))["metrics"] if m["name"] == "time_to_healthy"][0]["p50"])')
              echo "time_to_healthy: ${TTH}s (golden-path steps 3-6, informational)"
              echo "time_to_healthy: ${TTH}s (golden-path steps 3-6, informational, never gates)" >> "$GITHUB_STEP_SUMMARY"
            elif [ "$rc" -eq 1 ]; then
              echo "time_to_healthy: not measurable (steps 3-6 did not all pass or lack a valid duration)"
              echo "time_to_healthy: not measurable (steps 3-6 did not all pass or lack a valid duration)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "time_to_healthy: report unreadable or bad usage (perfbench exit ${rc})"
              echo "time_to_healthy: report unreadable or bad usage (perfbench exit ${rc})" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "time_to_healthy: no report"
            echo "time_to_healthy: no report" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Clean up docker state
        if: always()
        run: |
          nself stop --force 2>/dev/null || true
          nself admin stop 2>/dev/null || true
          # Belt-and-suspenders: golden-path.sh's own trap already does this,
          # but a hard failure inside the script (e.g. bash -e abort) could
          # skip its cleanup trap. Prune anything left behind by this run's
          # test projects within the job. GitHub-hosted ubuntu-latest VMs are
          # single-use and torn down after the job, but this keeps the step
          # correct if the workflow is ever pointed at a reused runner again.
          for d in /tmp/nself-golden-path-*; do
            [ -d "$d" ] || continue
            (cd "$d"/testproject 2>/dev/null && docker compose down -v --remove-orphans 2>/dev/null) || true
          done
          docker container prune -f 2>/dev/null || true
          docker volume prune -f 2>/dev/null || true
          docker network prune -f 2>/dev/null || true
          rm -rf /tmp/nself-golden-path-* /tmp/golden-path-diag-step*.txt /tmp/golden-path-claw-health.json /tmp/golden-path-ai-health.json 2>/dev/null || true

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: golden-path-report-${{ github.run_id }}
          path: /tmp/golden-path-report.json
          retention-days: 90

      # The per-step diagnostics (nself version, docker ps, doctor --quick) are
      # the only record of WHY a step failed, and the runner is discarded when
      # the job ends. Without this they were written and thrown away.
      - name: Upload golden-path diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: golden-path-diagnostics-${{ github.run_id }}
          path: /tmp/golden-path-diag-step*.txt
          if-no-files-found: ignore
          retention-days: 90

      - name: Archive result to .github/golden-path-results/
        if: always()
        run: |
          mkdir -p .github/golden-path-results
          RUN_DATE=$(date -u +%Y-%m-%dT%H%M%SZ)
          RESULT_FILE=".github/golden-path-results/${RUN_DATE}.json"
          if [ -f /tmp/golden-path-report.json ]; then
            # Inject run metadata
            python3 - <<PYEOF
          import json, os
          with open("/tmp/golden-path-report.json") as f:
              report = json.load(f)
          report["run_id"]   = os.environ.get("GITHUB_RUN_ID", "")
          report["run_date"] = "${RUN_DATE}"
          report["sha"]      = os.environ.get("GITHUB_SHA", "")[:12]
          with open("${RESULT_FILE}", "w") as f:
              json.dump(report, f, indent=2)
          PYEOF
          else
            echo '{"overall":"unknown","run_date":"'"${RUN_DATE}"'"}' > "${RESULT_FILE}"
          fi
          echo "Archived: ${RESULT_FILE}"
          cat "${RESULT_FILE}"

      # CLI-R05: this step used to `git push` the archived result straight to
      # main. That can never succeed — main requires the "Vet, Build & Test"
      # status check, so the bot push is rejected by the protected-branch hook
      # and the job goes red even when the smoke test itself passed. The result
      # is kept as a build artifact instead, which needs no write access to the
      # default branch.
      - name: Upload archived result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: golden-path-result-${{ github.run_id }}
          path: .github/golden-path-results/
          if-no-files-found: warn
          retention-days: 90

      - name: Summarise result
        # CLI-R05 follow-up: this step wrote its header to GITHUB_STEP_SUMMARY
        # but piped the actual pass/fail table to the python3 subshell's own
        # stdout (the job log) instead of the summary file, so the step
        # summary was effectively just a lone "### Golden Path Result" line —
        # a scheduled run could fail for five weeks and the one place meant to
        # surface it stayed blank. STEP_LABELS below mirrors the 13-step names
        # from scripts/golden-path.sh's STEP_BASELINE comments so a failure is
        # named, not just numbered.
        if: always()
        run: |
          {
            echo "### Golden Path Result"
            if [ -f /tmp/golden-path-report.json ]; then
              python3 - <<'PYEOF'
          import json

          STEP_LABELS = {
              "1": "brew/curl install", "2": "create test project dir",
              "3": "nself init", "4": "nself build", "5": "nself start",
              "6": "wait healthy", "7": "doctor --quick",
              "8": "license set", "9": "plugin install ai",
              "10": "plugin install claw", "11": "admin start", "12": "curl health",
              "13": "claw readiness",
          }

          with open("/tmp/golden-path-report.json") as f:
              r = json.load(f)
          overall = r.get("overall", "?")
          icon = "✅" if overall == "pass" else "❌"
          print(f"| Overall | {icon} {overall.upper()} |")
          print(f"| Pass    | {r.get('pass', 0)} |")
          print(f"| Fail    | {r.get('fail', 0)} |")
          print(f"| Warn    | {r.get('warn', 0)} |")

          failing = {
              idx: s for idx, s in r.get("steps", {}).items()
              if s.get("status") == "fail"
          }
          if failing:
              print()
              print("**Failing step(s):**")
              for idx, s in sorted(failing.items(), key=lambda kv: int(kv[0])):
                  label = STEP_LABELS.get(idx, "unknown step")
                  note = s.get("note", "")
                  print(f"- Step {idx} ({label}): {note}" if note else f"- Step {idx} ({label})")
          elif overall != "pass":
              print()
              print("_Overall failed but no individual step reported fail — check the job log._")
          PYEOF
            else
              echo "❌ FAIL — no /tmp/golden-path-report.json was produced (the smoke script exited before writing a report; see the \"Run golden-path smoke\" step log)"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
