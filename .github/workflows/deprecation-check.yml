name: Deprecation Cycle Check

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deprecation-check:
    name: Deprecation Cycle Enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # need full history to diff against base

      - name: Detect removed commands without registry entry
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.sha }}"

          # Compare the generated command inventory, not filenames.
          #
          # This used to derive command names from deleted files in
          # cmd/commands/, which is wrong in two ways and produced only false
          # positives the first time a command family was extracted: it treated
          # `gdpr_test.go` as a command named "gdpr_test", and it treated a
          # subcommand file like `soak_abort.go` or `dlq_replay.go` as a
          # separate top-level command. None of those names ever existed.
          #
          # .github/command-inventory.json has been the generated source of
          # truth for the registered surface since CLI-R06, and CI already
          # diffs it, so a command that genuinely disappears shows up here
          # exactly once under the name users actually type.
          REGISTRY="internal/deprecation/registry.yaml"
          INVENTORY=".github/command-inventory.json"

          git show "$BASE:$INVENTORY" > /tmp/inventory-base.json 2>/dev/null || echo '[]' > /tmp/inventory-base.json
          cp "$INVENTORY" /tmp/inventory-head.json

          REMOVED=$(python3 -c "
          import json
          base = {c['name'] for c in json.load(open('/tmp/inventory-base.json'))}
          head = {c['name'] for c in json.load(open('/tmp/inventory-head.json'))}
          print(' '.join(sorted(base - head)))
          ")

          if [ -z "$REMOVED" ]; then
            echo "OK: no top-level commands removed in this PR"
            exit 0
          fi

          echo "Top-level commands removed in this PR: $REMOVED"

          # A canon move (internal/canon/domains/*.yaml) relocates a top-level
          # command in the v1.5 inventory and keeps the old spelling as a
          # deprecated shim with its own since/removal_at cycle. Hidden
          # framework builtins stay runnable even when omitted from help.
          CANON_KEPT=$(python3 -c "
          import json
          d = json.load(open('.github/command-registry.json'))
          print(' '.join(sorted(c['path'][len('nself '):] for c in d['commands']
                                if ((c.get('canon') == 'deprecated-shim' and c.get('target'))
                                    or c.get('canon') == 'builtin')
                                and c['path'].count(' ') == 1)))
          ")

          FAIL=0
          for CMD in $REMOVED; do
            if [[ " $CANON_KEPT " == *" $CMD "* ]]; then
              echo "OK: '$CMD' remains in the command canon registry"
              continue
            fi
            if ! grep -q "name:.*nself $CMD" "$REGISTRY" 2>/dev/null; then
              echo "ERROR: Command '$CMD' removed without deprecation registry entry."
              echo "       Add an entry to $REGISTRY before removing a command."
              FAIL=1
            fi
          done

          if [ "$FAIL" -eq 1 ]; then
            exit 1
          fi
          echo "OK: all removed commands have registry entries"

      - name: Detect skip-phase removals (stable → removed in one commit)
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.sha }}"

          # Check registry.yaml diff: phase must go 1 → 2 → 3, not jump from 1 to 3
          REGISTRY_DIFF=$(git diff "$BASE" "$HEAD" -- internal/deprecation/registry.yaml || true)
          if [ -z "$REGISTRY_DIFF" ]; then
            echo "OK: no registry changes"
            exit 0
          fi

          # Look for additions of phase: 3 entries — these need a prior phase: 2 in base
          # We check if any NEW phase: 3 entry's name was NOT already at phase: 2 in base
          PHASE3_NAMES=$(echo "$REGISTRY_DIFF" | grep '^+.*phase: 3' | grep -v '^---' || true)
          if [ -z "$PHASE3_NAMES" ]; then
            echo "OK: no phase 3 entries added"
            exit 0
          fi

          echo "Phase 3 entries added in this PR — verifying prior phase 2 existed:"
          BASE_REGISTRY=$(git show "$BASE:internal/deprecation/registry.yaml" 2>/dev/null || echo "items: []")
          FAIL=0
          while IFS= read -r line; do
            NAME=$(echo "$line" | grep -oP "name: '?\K[^'\"]+")
            if [ -n "$NAME" ]; then
              if ! echo "$BASE_REGISTRY" | grep -q "name:.*$NAME"; then
                echo "ERROR: '$NAME' jumped directly to phase 3 without phase 1/2 in base."
                FAIL=1
              fi
            fi
          done <<< "$PHASE3_NAMES"

          if [ "$FAIL" -eq 1 ]; then
            exit 1
          fi
          echo "OK: phase 3 entries all have prior deprecation history"

      - name: Verify Sunset header entries have F19 backing
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.sha }}"

          # Any new Sunset header added to ping_api must have a matching row in F19 sunset table
          # We look for additions of 'Sunset:' in ping_api source
          PING_DIFF=$(git diff "$BASE" "$HEAD" -- '*.ts' '*.js' | grep '^+.*Sunset:' | grep -v '^---' || true)
          if [ -z "$PING_DIFF" ]; then
            echo "OK: no new Sunset headers"
            exit 0
          fi

          # Check that F19 has a sunset-date table with at least one entry per added Sunset line
          F19="../../.claude/docs/sport/F19-API-CONTRACT-LOCK-v1.0.9.md"
          if [ ! -f "$F19" ]; then
            # Try relative paths for different repo checkouts
            F19=".claude/docs/sport/F19-API-CONTRACT-LOCK-v1.0.9.md"
          fi

          if ! grep -q "Sunset-Date Table" "$F19" 2>/dev/null; then
            echo "ERROR: Sunset header added but F19 has no Sunset-Date Table section."
            echo "       Add the sunset date to F19 before adding a Sunset response header."
            exit 1
          fi
          echo "OK: Sunset headers have F19 backing"

      - name: Summary
        if: always()
        run: echo "Deprecation cycle check complete."
