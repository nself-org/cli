name: Publish @nself/sdk to npm

# Publishes the consumer-facing @nself/sdk TypeScript package to npm.
# Triggers on:
#   - cli release tag (v*)            -- publishes in lockstep with CLI
#   - sdk-scoped tag (cli-sdk/v*)     -- publishes SDK only (out-of-band)
#   - workflow_dispatch               -- manual publish with version input
#
# Requires NPM_TOKEN secret with write access to @nself scope.
# Counterpart to sdk-ts-publish.yml which covers @nself/plugin-sdk.

on:
  push:
    tags:
      - 'v*'
      - 'cli-sdk/v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish version (e.g. 1.0.13). Blank = use package.json.'
        required: false
        type: string

permissions:
  contents: write
  id-token: write

# cancel-in-progress: false — this workflow deploys/publishes/releases; a superseding
# run must queue behind an in-flight one, never cancel it mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @nself/sdk
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Check preconditions
        id: check
        run: |
          if [ ! -f sdk/ts-sdk/package.json ]; then
            echo "sdk/ts-sdk/package.json absent — nothing to publish. No-op success."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "NPM_TOKEN not set — skipping publish steps."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # npm rejects re-publishing an existing version with E403, which turns
          # any re-run of a partially-failed release into a permanent red check
          # even though the package is already on the registry. Publishing is
          # idempotent from our side, so treat "already there" as done.
          VERSION=$(node -p "require('./sdk/ts-sdk/package.json').version")
          if npm view "@nself/sdk@${VERSION}" version >/dev/null 2>&1; then
            echo "@nself/sdk@${VERSION} is already published — nothing to do. No-op success."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.check.outputs.proceed == 'true'
        working-directory: sdk/ts-sdk
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Type-check
        if: steps.check.outputs.proceed == 'true'
        working-directory: sdk/ts-sdk
        run: pnpm typecheck

      - name: Build
        if: steps.check.outputs.proceed == 'true'
        working-directory: sdk/ts-sdk
        run: pnpm build

      # pnpm does not expand ${VAR} inside .npmrc, but actions/setup-node writes
      # exactly that: //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}.
      # pnpm therefore sends the literal string as the token, publishes
      # unauthenticated, and npm masks the auth failure as a 404:
      #
      #   WARN Issue while reading ".npmrc". Failed to replace env in config:
      #        ${NODE_AUTH_TOKEN}
      #   npm error 404
      #
      # A 404 on a package that already exists (@nself/sdk was on 1.3.3) is npm
      # declining to confirm the package exists to an unauthenticated caller.
      # Writing the resolved token avoids the expansion entirely.
      - name: Authenticate pnpm to npm
        if: steps.check.outputs.proceed == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "NPM_TOKEN not set — publish would be unauthenticated; failing loudly instead of 404ing."
            exit 1
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" >> "$HOME/.npmrc"
          echo "wrote resolved auth token to ~/.npmrc"

      - name: Publish to npm
        if: steps.check.outputs.proceed == 'true'
        working-directory: sdk/ts-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --provenance --access public --no-git-checks

      - name: Create GitHub Release
        if: steps.check.outputs.proceed == 'true' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION=$(node -p "require('./sdk/ts-sdk/package.json').version")
          # --latest=false is load-bearing. The SDK publishes into nself-org/cli,
          # so without it GitHub hands the "Latest" slot to this release simply
          # because it is newest. install.nself.org resolves releases/latest and
          # would then download nself-<ver>-linux-amd64.tar.gz from an SDK
          # release that ships no CLI binaries — a hard 404 for every new user.
          # That is exactly what happened with v1.2.7 on 2026-08-18.
          gh release create "$TAG" \
            --title "@nself/sdk v${VERSION}" \
            --notes "Published @nself/sdk v${VERSION} to npm." \
            --draft=false \
            --prerelease=false \
            --latest=false \
            || true
