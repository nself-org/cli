name: Registry Performance Benchmark

on:
  schedule:
    - cron: '0 2 * * *'  # 2 AM UTC daily
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry-perf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build CLI
        run: go build -o nself ./cmd/nself

      - name: Load baseline metrics
        id: baseline
        run: |
          if git fetch origin perf/baseline 2>/dev/null && git show FETCH_HEAD:.github/registry-perf-baseline.json > /tmp/baseline.json 2>/dev/null; then
            echo "baseline_loaded=true" >> $GITHUB_OUTPUT
          else
            echo "baseline_loaded=false" >> $GITHUB_OUTPUT
          fi

      - name: Run registry network fetch (cold cache, informational)
        id: network
        run: |
          # `plugin search` requires a query positional arg (Args:
          # cobra.MinimumNArgs(1) in cmd/commands/plugin_search.go) -- calling
          # it with no query fails fast with "requires at least 1 arg(s)",
          # which was making this step measure a cobra parse error instead of
          # a real search. "ai" matches the command's own --help examples.
          #
          # This is the FIRST invocation in the job, so the on-disk registry
          # cache (internal/plugin/registry_cache.go) is cold: the timing
          # here is DNS + TLS + HTTP GET to plugins.nself.org (a Cloudflare
          # Worker), not local code. It was previously reported as
          # "search_ms" and gated at <120ms, which made the job measure
          # third-party network latency against a code-regression threshold
          # -- three nightly runs failed at 703-1124ms, none of it search
          # code. Tracked here as its own informational number; the actual
          # <100ms/<120ms search SLO is measured warm-cache below, which is
          # what internal/plugin/REGISTRY-PERF-TARGETS.md targets.
          CACHE_FILE="$HOME/.nself/cache/plugins/registry.json"
          rm -f "$CACHE_FILE"
          start=$(date +%s%N)
          timeout 5 ./nself plugin search ai --json > /dev/null || true
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "network_ms=$ms" >> $GITHUB_OUTPUT
          if [ -f "$CACHE_FILE" ]; then
            echo "cache_warm=true" >> $GITHUB_OUTPUT
          else
            echo "cache_warm=false" >> $GITHUB_OUTPUT
          fi
          echo "Registry network fetch (cold cache): ${ms}ms"

      - name: Run plugin search benchmark (warm cache, p95 <100ms)
        id: search
        run: |
          # Second invocation in the job. The registry-fetch step above
          # just wrote the on-disk cache (5-minute TTL), so
          # plugin.FetchRegistry now takes the readCache() hit instead of
          # going over the network -- this measures cache read + JSON parse
          # + query match + JSON marshal, the actual code path the
          # <100ms/<120ms SLO targets.
          start=$(date +%s%N)
          timeout 5 ./nself plugin search ai --json > /dev/null || true
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "search_ms=$ms" >> $GITHUB_OUTPUT
          echo "Plugin search (warm cache): ${ms}ms"

      - name: Run single plugin install benchmark (cold cache <30s)
        id: single
        run: |
          start=$(date +%s%N)
          timeout 60 ./nself plugin info ai --json > /dev/null || true
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "single_ms=$ms" >> $GITHUB_OUTPUT
          echo "Single plugin info: ${ms}ms"

      - name: Run bundle install benchmark (13 plugins <60s)
        id: bundle
        run: |
          # `nself plugin list --bundle <slug> --json` does not exist -- and
          # never did. `plugin list` only registers --installed/--detailed/
          # --category/--show-eol (cmd/commands/plugin.go), it has no --json
          # flag either, and the local PluginManifest type it reads
          # (internal/plugin/interfaces.go) carries no Bundle field at all.
          # Bundle membership is only known to the live marketplace API
          # (`plugin marketplace list --bundle`, internal/plugin_marketplace.go),
          # which is a network call to https://plugins.nself.org/marketplace --
          # a fundamentally different measurement (network latency, not local
          # registry parse) from what this step was meant to benchmark.
          # Substituting it would silently change the metric, so this is left
          # unmeasured instead of faked. See "Check regression thresholds"
          # below for how bundle_ms=0 is reported (WARN, not a real pass).
          echo "bundle_ms=0" >> $GITHUB_OUTPUT
          echo "Bundle list (13 plugins): SKIPPED -- no local command filters the local registry by bundle"

      - name: Measure registry parse + index
        id: parse
        run: |
          go test -bench=BenchmarkRegistryParse -benchtime=10x ./internal/plugin -run=^$ 2>&1 | tee bench.txt
          ns_per_op=$(grep "BenchmarkRegistryParse" bench.txt | awk '{print $3}' | sed 's/ns\/op//')
          ns_per_op="${ns_per_op:-0}"
          if [ "$ns_per_op" = "0" ]; then
            ms="0"
          else
            ms=$(echo "scale=2; $ns_per_op / 1000000" | bc)
            ms="${ms:-0}"
          fi
          echo "parse_ms=$ms" >> $GITHUB_OUTPUT
          echo "Registry parse: ${ms}ms"

      - name: Check regression thresholds
        env:
          NETWORK_MS: ${{ steps.network.outputs.network_ms }}
          CACHE_WARM: ${{ steps.network.outputs.cache_warm }}
          SEARCH_MS: ${{ steps.search.outputs.search_ms }}
          SINGLE_MS: ${{ steps.single.outputs.single_ms }}
          BUNDLE_MS: ${{ steps.bundle.outputs.bundle_ms }}
          PARSE_MS: ${{ steps.parse.outputs.parse_ms }}
        run: |
          echo "=== Registry Performance Results ==="
          echo "network_ms: $NETWORK_MS (informational only -- cold-cache fetch latency to plugins.nself.org, not a code-regression gate)"
          echo "search_ms: $SEARCH_MS (target: <100ms, threshold: <120ms; warm-cache code path only)"
          echo "single_ms: $SINGLE_MS (target: <30s, threshold: <36s)"
          echo "bundle_ms: $BUNDLE_MS (target: <60s, threshold: <72s)"
          echo "parse_ms: $PARSE_MS (target: <50ms, threshold: <60ms)"

          # Network leg: never gates the code-path threshold below. Generous
          # (10s) and WARN-only -- it exists to surface a genuinely dead/
          # unreachable registry endpoint, not to fail the job on ordinary
          # third-party network jitter (703-1124ms was observed as "normal"
          # across three nights before this split existed).
          if [ "$NETWORK_MS" -gt 10000 ]; then
            echo "WARN registry network fetch very slow: ${NETWORK_MS}ms > 10000ms -- check plugins.nself.org edge health (not a code regression, not blocking)"
          fi

          # Fail if >20% regression from targets
          # NOTE: SEARCH_MS, SINGLE_MS, BUNDLE_MS are all in milliseconds
          if [ "$CACHE_WARM" != "true" ]; then
            echo "WARN registry cache did not warm after the network-fetch step (offline runner or registry outage) -- search_ms of ${SEARCH_MS}ms reflects network, not code; skipping the code-path gate for this run instead of failing on network conditions"
          elif [ "$SEARCH_MS" -gt 120 ]; then
            echo "FAIL search regression: ${SEARCH_MS}ms > 120ms (warm-cache code path)" && exit 1
          fi
          if [ "$SINGLE_MS" -gt 36000 ]; then
            echo "FAIL single install regression: ${SINGLE_MS}ms > 36000ms (36s)" && exit 1
          fi
          if [ "$BUNDLE_MS" = "0" ]; then
            echo "WARN bundle_ms is 0 -- bundle-filtered local listing is not currently measurable by any CLI command (see the benchmark step); this is not a real pass"
          elif [ "$BUNDLE_MS" -gt 72000 ]; then
            echo "FAIL bundle install regression: ${BUNDLE_MS}ms > 72000ms (72s)" && exit 1
          fi
          if [ -n "$PARSE_MS" ] && [ "$PARSE_MS" != "0" ] && [ "$(echo "$PARSE_MS > 60" | bc)" -eq 1 ]; then
            echo "FAIL registry parse regression: ${PARSE_MS}ms > 60ms" && exit 1
          elif [ -z "$PARSE_MS" ] || [ "$PARSE_MS" = "0" ]; then
            echo "WARN parse_ms is 0 -- BenchmarkRegistryParse ran but produced no timing output"
          fi
          echo "OK All perf targets passed"

      - name: Update baseline on perf/baseline branch
        if: success()
        run: |
          NETWORK_VAL="${{ steps.network.outputs.network_ms }}"
          SEARCH_VAL="${{ steps.search.outputs.search_ms }}"
          SINGLE_VAL="${{ steps.single.outputs.single_ms }}"
          BUNDLE_VAL="${{ steps.bundle.outputs.bundle_ms }}"
          PARSE_VAL="${{ steps.parse.outputs.parse_ms }}"
          PARSE_VAL="${PARSE_VAL:-0}"
          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # perf/baseline does not exist on origin (verified: `git ls-remote
          # origin perf/baseline` returns nothing) -- an unguarded `git fetch`
          # of a missing ref is fatal ("couldn't find remote ref"), exit 128,
          # which is what was actually failing this job (the search/bundle
          # cobra errors above are swallowed by `|| true` and never reach
          # this step). Bootstrap the branch as an orphan on first run.
          if git fetch origin perf/baseline 2>/dev/null; then
            git checkout -B perf/baseline FETCH_HEAD
          else
            echo "perf/baseline not found on origin -- bootstrapping as a new orphan branch"
            git checkout --orphan perf/baseline
            git rm -rf . > /dev/null 2>&1 || true
          fi
          mkdir -p .github
          cat > .github/registry-perf-baseline.json << JSONEOF
          {
            "network_ms": $NETWORK_VAL,
            "search_ms": $SEARCH_VAL,
            "single_ms": $SINGLE_VAL,
            "bundle_ms": $BUNDLE_VAL,
            "parse_ms": $PARSE_VAL,
            "timestamp": "$TIMESTAMP"
          }
          JSONEOF
          git add .github/registry-perf-baseline.json
          git -c user.email="ci@nself.org" -c user.name="nself-ci" commit -m "perf: update registry baseline [skip ci]" || true
          git push origin perf/baseline

      - name: Alert on regression
        if: failure()
        run: |
          echo "Registry performance regression detected in nightly benchmark"
          echo "Targets: search <100ms (warm cache, code path), single <30s, bundle <60s, parse <50ms"
          echo "Registry network fetch latency is tracked separately (network_ms) and never fails this gate"
          echo "Review baseline at .github/registry-perf-baseline.json on perf/baseline branch"
