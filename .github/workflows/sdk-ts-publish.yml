name: Publish TypeScript SDK to npm

# USER ACTION REQUIRED:
#   Set NPM_TOKEN in GitHub org secrets (github.com/organizations/nself-org/settings/secrets/actions):
#     NPM_TOKEN — npm publish token with write access to the @nself scope.
#                 Create at https://www.npmjs.com/settings/<user>/tokens (type: Automation).
#   npm provenance attestation is enabled (--provenance flag). Ensure the npm package is
#   configured with the nself-org GitHub repository for provenance to resolve correctly.
#   Without NPM_TOKEN, this workflow skips publish steps gracefully (no-op success).
#
# Triggers on:
#   - cli release tag (v*)            -- publishes SDK in lockstep with CLI
#   - sdk-scoped tag (cli-sdk-ts/v*)  -- publishes SDK only (out-of-band)
#   - workflow_dispatch               -- manual publish with version input
#
# No branch-push trigger: a push to main never starts this workflow.
# No leading `---` and `on:` unquoted, mirroring the repo's other workflows
# (a leading `---` made GitHub's parser phantom-fail this file on every push).
#
# NPM_TOKEN is P104-held (absent in CI by design until SDK publish is wired).
# secrets context is not valid in job-level / step-level `if:`; instead the
# first step reads the token via step `env:` and the sdk/ts dir existence,
# emitting `proceed`. All heavy steps gate on that output, so a v* tag run is
# green (publish steps skipped, not failed) when the token is absent.

on:
  push:
    tags:
      - 'v*'
      - 'cli-sdk-ts/v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish version (e.g. 1.0.13). Blank = use package.json.'
        required: false
        type: string

permissions:
  contents: read

# cancel-in-progress: false — this workflow deploys/publishes/releases; a superseding
# run must queue behind an in-flight one, never cancel it mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @nself/sdk-ts to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # Preflight: proceed only when the SDK dir exists AND the npm token is
      # present. NPM_TOKEN is read via step env (the valid place to reference
      # the secrets context). When absent (P104-held) downstream steps skip
      # and the job still succeeds, keeping the v* tag run green.
      - name: Preflight (sdk/ts present + npm auth)
        id: preflight
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ ! -f sdk/ts/package.json ]; then
            echo "sdk/ts/package.json absent — nothing to publish. No-op success."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          elif [ -z "${NPM_TOKEN}" ]; then
            echo "NPM_TOKEN absent (P104-held). SDK publish deferred — no-op success."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "sdk/ts present and NPM_TOKEN set. Proceeding with publish."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6
        if: steps.preflight.outputs.proceed == 'true'
        with:
          version: 9

      - uses: actions/setup-node@v7
        if: steps.preflight.outputs.proceed == 'true'
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Override version (workflow_dispatch only)
        if: steps.preflight.outputs.proceed == 'true' && inputs.version != ''
        run: |
          cd sdk/ts
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ inputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Install dependencies
        if: steps.preflight.outputs.proceed == 'true'
        run: |
          cd sdk/ts
          pnpm install --frozen-lockfile

      - name: Build
        if: steps.preflight.outputs.proceed == 'true'
        run: |
          cd sdk/ts
          pnpm build

      # pnpm does not expand ${VAR} inside .npmrc, but actions/setup-node writes
      # exactly that: //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}.
      # pnpm therefore sends the literal string as the token, publishes
      # unauthenticated, and npm masks the auth failure as a 404:
      #
      #   WARN Issue while reading ".npmrc". Failed to replace env in config:
      #        ${NODE_AUTH_TOKEN}
      #   npm error 404
      #
      # A 404 on a package that already exists (@nself/sdk was on 1.3.3) is npm
      # declining to confirm the package exists to an unauthenticated caller.
      # Writing the resolved token avoids the expansion entirely.
      - name: Authenticate pnpm to npm
        if: steps.preflight.outputs.proceed == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "NPM_TOKEN not set — publish would be unauthenticated; failing loudly instead of 404ing."
            exit 1
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" >> "$HOME/.npmrc"
          echo "wrote resolved auth token to ~/.npmrc"

      - name: Publish to npm (with provenance, skip-existing, retry up to 3x)
        if: steps.preflight.outputs.proceed == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd sdk/ts
          # If the version on npm already matches, skip without failing.
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "${PKG}@${VER}" version >/dev/null 2>&1; then
            echo "${PKG}@${VER} already published, skipping."
            exit 0
          fi
          # Bounded retry: 3 attempts, exponential backoff starting at 30s.
          attempt=1
          delay=30
          until pnpm publish --access public --no-git-checks --provenance; do
            if [ "$attempt" -ge 3 ]; then
              echo "Publish failed after $attempt attempts."
              exit 1
            fi
            echo "Attempt $attempt failed. Retrying in ${delay}s..."
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done
