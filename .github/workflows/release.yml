name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write   # required for Sigstore keyless signing (OIDC)
  attestations: write  # required for SLSA provenance via actions/attest-build-provenance

# cancel-in-progress: false — this workflow deploys/publishes/releases; a superseding
# run must queue behind an in-flight one, never cancel it mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # Build the release artifacts (tarballs + checksums.txt) on ubuntu-latest.
  # Outputs the checksum digest line so the provenance job can reference it.
  # Also computes the SHA256 of the source tarball for the Homebrew formula.
  # ────────────────────────────────────────────────────────────────────────
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
      source_sha256: ${{ steps.source_sha256.outputs.sha256 }}
    env:
      CGO_ENABLED: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.26-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.25-

      # Self-hosted runner base image lacks the tools `make dist` needs: build-essential
      # (make/gcc for the Go cross-build) and zip (Windows .zip packaging). 2026-07-01:
      # a missing `make` then a missing `zip` broke nself-org/cli release.yml on
      # nself-sentry-runner{,2,3}. Boxes are now patched at the OS level (build-essential
      # + zip/unzip in the cloud-init base packages) so this step is normally a no-op.
      # The install branch is a self-heal for any not-yet-patched runner: the runner
      # user has a scoped NOPASSWD apt-get entry (/etc/sudoers.d/actions-runner-apt),
      # so `sudo apt-get` works without a TTY.
      - name: Ensure build tools present (make, zip)
        run: |
          missing=""
          command -v make >/dev/null 2>&1 || missing="$missing build-essential"
          command -v zip  >/dev/null 2>&1 || missing="$missing zip"
          if [ -z "$missing" ]; then
            echo "build tools present: make=$(make --version | head -1), zip=$(zip --version 2>/dev/null | head -2 | tail -1)"
            exit 0
          fi
          echo "missing tools ->$missing ; attempting self-heal install"
          if sudo -n apt-get update -qq && sudo -n apt-get install -y -qq $missing; then
            echo "installed:$missing"
            exit 0
          fi
          echo "::error::Required build tools ($missing) are missing and passwordless 'sudo apt-get' is unavailable."
          echo "::error::Patch the box: 'apt-get install -y build-essential zip unzip' as root, and add"
          echo "::error::/etc/sudoers.d/actions-runner-apt (NOPASSWD apt-get for the runner user)."
          echo "::error::See ~/Sites/.claude/nsentry-server-standard.md and cloud-init base packages."
          exit 1

      - name: Stamp version from tag
        run: echo "${GITHUB_REF_NAME#v}" > .github/VERSION

      - name: Version lockstep pre-flight (CLI ↔ Admin)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fetch admin/package.json via GitHub Contents API (same org, GITHUB_TOKEN has read access)
          ADMIN_PKG=$(gh api repos/nself-org/admin/contents/package.json \
            --jq '.content' | base64 -d 2>/dev/null || echo "")
          if [ -z "${ADMIN_PKG}" ]; then
            echo "WARNING: Could not fetch admin/package.json — skipping lockstep pre-flight"
            echo "  (Non-fatal: admin repo may be private with restricted access)"
            exit 0
          fi
          ADMIN_VERSION=$(printf '%s' "${ADMIN_PKG}" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['version'])" 2>/dev/null || echo "")
          CLI_VERSION="${GITHUB_REF_NAME#v}"
          echo "CLI version (tag):  ${CLI_VERSION}"
          echo "Admin version:      ${ADMIN_VERSION}"
          if [ -n "${ADMIN_VERSION}" ] && [ "${CLI_VERSION}" != "${ADMIN_VERSION}" ]; then
            echo "VERSION LOCKSTEP FAILED: CLI tag is ${CLI_VERSION} but Admin is at ${ADMIN_VERSION}"
            echo "Bump admin/package.json to ${CLI_VERSION} before cutting this tag."
            exit 1
          fi
          echo "Lockstep: CLI == Admin == ${CLI_VERSION}"

      - name: Build dist
        env:
          NSELF_LICENSE_PUBKEY_HEX: ${{ secrets.NSELF_LICENSE_PUBKEY_HEX }}
        run: make dist

      # S49-T05: verify each tarball's embedded binary arch matches the tarball filename.
      # Catches cross-compile errors where wrong GOOS/GOARCH sneaks into a release asset.
      # Uses scripts/verify-tarball-arch.sh — works on macOS BSD file and Linux file.
      - name: Verify tarball arch matches filename (S49-T05)
        run: |
          chmod +x scripts/verify-tarball-arch.sh
          bash scripts/verify-tarball-arch.sh dist/
          echo "Tarball arch verification passed"

      - name: Compute source tarball SHA256 for Homebrew formula
        id: source_sha256
        run: |
          # The Homebrew formula references the GitHub source archive, not the dist tarballs.
          # Compute its SHA256 here so the dispatch payload carries it — the formula update
          # workflow can skip its own download/compute step and use this value directly.
          TAG="${GITHUB_REF_NAME}"
          TARBALL_URL="https://github.com/nself-org/cli/archive/refs/tags/${TAG}.tar.gz"
          echo "Computing SHA256 for ${TARBALL_URL} ..."
          SHA256=$(curl -fsSL "${TARBALL_URL}" | sha256sum | awk '{print $1}')
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "Source tarball SHA256: ${SHA256}"

      - name: Emit artifact hashes for provenance
        id: hashes
        working-directory: dist
        run: |
          # base64-encoded sha256-sums of every tarball and zip, for slsa-github-generator
          HASHES=$(sha256sum *.tar.gz *.zip | base64 -w0)
          echo "hashes=$HASHES" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-binaries
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 1

      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          name: release-checksums
          path: dist/checksums.txt
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────
  # Generate SPDX SBOM for every tarball (S34-T02).
  # ────────────────────────────────────────────────────────────────────────
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-binaries
          path: dist

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM — SPDX (source tree)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Generate SBOM — CycloneDX 1.5 (source tree, Q04)
        run: |
          syft packages . --output cyclonedx-json=sbom.cdx.json
          echo "CycloneDX SBOM generated: $(wc -c < sbom.cdx.json) bytes"

      - name: SHA-256 CycloneDX SBOM (Q04 — append to checksums.txt)
        working-directory: dist
        run: |
          sha256sum ../sbom.cdx.json >> checksums.txt
          sha256sum ../sbom.spdx.json >> checksums.txt
          echo "SBOM digests appended to checksums.txt"

      - name: Generate SBOM for each tarball
        run: |
          mkdir -p sboms
          for tb in dist/*.tar.gz; do
            name=$(basename "$tb" .tar.gz)
            syft "$tb" -o spdx-json > "sboms/${name}.sbom.spdx.json"
            syft "$tb" -o cyclonedx-json > "sboms/${name}.sbom.cdx.json"
          done

      - name: Upload SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: release-sboms
          path: |
            sbom.spdx.json
            sbom.cdx.json
            sboms/
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────
  # SLSA L3 provenance for all tarballs (S34-T03).
  # Uses the official slsa-github-generator reusable workflow.
  # ────────────────────────────────────────────────────────────────────────
  provenance:
    name: Generate SLSA provenance
    needs: build
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: false
      provenance-name: provenance.intoto.jsonl

  # ────────────────────────────────────────────────────────────────────────
  # Verify Homebrew formula lockstep (S06-T02).
  # Reads the formula version from nself-org/homebrew-nself via gh api and
  # compares against the tag being cut. Fails with a clear message if they
  # differ — prevents the P92/P93 drift where CLI shipped without homebrew sync.
  # Uses GITHUB_TOKEN (read-only) — does NOT need HOMEBREW_TAP_DISPATCH_TOKEN.
  # ────────────────────────────────────────────────────────────────────────
  verify-homebrew-lockstep:
    name: Verify Homebrew formula lockstep
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check formula version matches tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Strip leading 'v' to match the bare version string in the formula.
          TAG_VERSION="${TAG#v}"

          echo "Cutting tag: ${TAG} (version: ${TAG_VERSION})"

          # Fetch Formula/nself.rb from homebrew-nself via the GitHub Contents API.
          # GITHUB_TOKEN has read access to all public repos in the same org.
          FORMULA_CONTENT=$(gh api \
            repos/nself-org/homebrew-nself/contents/Formula/nself.rb \
            --jq '.content' | base64 -d)

          if [ -z "$FORMULA_CONTENT" ]; then
            echo "ERROR: Could not fetch Formula/nself.rb from nself-org/homebrew-nself"
            echo "  Check that the repo is accessible and the file exists."
            exit 1
          fi

          # Extract the version line: matches 'version "X.Y.Z"'
          FORMULA_VERSION=$(printf '%s' "$FORMULA_CONTENT" \
            | grep -E '^\s*version\s+"[0-9]+\.[0-9]+\.[0-9]+"' \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' \
            | head -1)

          if [ -z "$FORMULA_VERSION" ]; then
            echo "ERROR: Could not parse version from Formula/nself.rb"
            echo "  Formula content excerpt:"
            printf '%s' "$FORMULA_CONTENT" | head -20
            exit 1
          fi

          echo "Formula version: ${FORMULA_VERSION}"

          if [ "${FORMULA_VERSION}" != "${TAG_VERSION}" ]; then
            echo "LOCKSTEP GATE FAILED"
            echo "  Homebrew formula is at v${FORMULA_VERSION}, but cutting tag ${TAG}"
            echo "  Bump Formula/nself.rb to version \"${TAG_VERSION}\" first, then re-push the tag."
            echo "  See: https://github.com/nself-org/homebrew-nself/blob/main/Formula/nself.rb"
            exit 1
          fi

          echo "Lockstep verified: formula v${FORMULA_VERSION} == tag ${TAG}"

  # ────────────────────────────────────────────────────────────────────────
  # Sign every artifact with cosign keyless (S34-T01) and publish the release
  # body auto-generated from the changelog + git log (S34-T09).
  # ────────────────────────────────────────────────────────────────────────
  sign-and-publish:
    name: Sign and publish release
    runs-on: ubuntu-latest
    needs: [build, sbom, provenance, verify-homebrew-lockstep]
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-binaries
          path: dist

      - name: Download checksums
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-checksums
          path: dist

      - name: Download SBOMs
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-sboms
          path: dist

      - name: Download provenance
        uses: actions/download-artifact@v8.0.1
        with:
          name: provenance.intoto.jsonl
          path: dist

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign all artifacts (keyless)
        working-directory: dist
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          # cosign_sign_idempotent: sign $1 into bundle $2.
          #
          # WHY THIS EXISTS: When the same tag is re-pushed (e.g. to fix an upstream
          # gate issue), the re-run produces byte-identical artifacts.  cosign uploads
          # to the Sigstore Rekor public-good transparency log; the second run reports
          # "Signature already exists" and then the immediate inclusion-proof readback
          # (GET /api/v1/log/entries/{uuid}) returns 404 due to Rekor eventual-
          # consistency / dedup behaviour.  That 404 makes cosign exit non-zero even
          # though the signature IS in Rekor and the bundle written by the first run is
          # still valid.  This is NOT a signing failure — the artifact is already signed.
          #
          # APPROACH: Attempt sign-blob; if the exit is non-zero AND the output contains
          # exactly the "Signature already exists" dedup signal AND the prior bundle file
          # exists (meaning the first run succeeded), treat the outcome as success.
          # Any other non-zero exit (key/identity error, network down, non-dedup error)
          # still propagates as a real failure.  This is NOT a blanket error swallow.
          #
          # Bounded retry (max 3, exp backoff) is applied before accepting already-exists,
          # in case the inclusion-proof 404 is transient rather than the dedup case.
          cosign_sign_idempotent() {
            local artifact="$1"
            local bundle="$2"
            local max_attempts=3
            local attempt=1
            local delay=4
            while [ "${attempt}" -le "${max_attempts}" ]; do
              output=$(cosign sign-blob --yes --bundle "${bundle}" "${artifact}" 2>&1)
              exit_code=$?
              if [ "${exit_code}" -eq 0 ]; then
                echo "[cosign] signed ${artifact} (attempt ${attempt})"
                return 0
              fi
              # Detect the specific Rekor dedup/eventual-consistency failure pattern.
              # Both strings must be present to match — avoids false positives.
              if echo "${output}" | grep -q "Signature already exists" && \
                 echo "${output}" | grep -q "getLogEntryByUuidNotFound"; then
                if [ -f "${bundle}" ]; then
                  echo "[cosign] ${artifact}: signature already in Rekor (dedup) — existing bundle accepted (attempt ${attempt})"
                  return 0
                fi
              fi
              echo "[cosign] attempt ${attempt}/${max_attempts} failed for ${artifact} (exit ${exit_code}): ${output}"
              if [ "${attempt}" -lt "${max_attempts}" ]; then
                echo "[cosign] retrying in ${delay}s..."
                sleep "${delay}"
                delay=$((delay * 2))
              fi
              attempt=$((attempt + 1))
            done
            echo "[cosign] ERROR: signing ${artifact} failed after ${max_attempts} attempts"
            echo "${output}"
            return "${exit_code}"
          }

          for f in *.tar.gz *.zip checksums.txt sbom.spdx.json sbom.cdx.json provenance.intoto.jsonl; do
            if [ -f "$f" ]; then
              cosign_sign_idempotent "$f" "${f}.sig"
            fi
          done
          # Q04: dedicated cosign bundle for CycloneDX SBOM (consumer-verifiable)
          if [ -f sbom.cdx.json ]; then
            cosign_sign_idempotent sbom.cdx.json sbom.cdx.json.bundle
            echo "CycloneDX SBOM cosign bundle written: sbom.cdx.json.bundle"
          fi

      - name: Determine channel from tag
        id: channel
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            *-rc*)   echo "channel=rc"     >> "$GITHUB_OUTPUT" ;;
            *-edge*) echo "channel=edge"   >> "$GITHUB_OUTPUT" ;;
            *)       echo "channel=stable" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Generate release body (S34-T09)
        id: body
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          channel="${{ steps.channel.outputs.channel }}"

          # Pull the matching changelog section if present.
          # Canonical changelog lives at .github/wiki/Changelog.md per Sub-Repo Root Hygiene rule.
          changelog_section=""
          changelog_path=""
          if [ -f .github/wiki/Changelog.md ]; then
            changelog_path=".github/wiki/Changelog.md"
          elif [ -f CHANGELOG.md ]; then
            changelog_path="CHANGELOG.md"
          fi
          if [ -n "$changelog_path" ]; then
            # extract from "## [version]" or "## vversion" to the next "## " heading
            changelog_section=$(awk -v v="$version" '
              BEGIN{found=0}
              /^## / {
                if (found) exit
                if (index($0, v) > 0) { found=1; print; next }
              }
              found { print }
            ' "$changelog_path")
          fi

          # Build the commit log since the previous tag.
          prev_tag=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || echo "")
          if [ -n "$prev_tag" ]; then
            commits=$(git log --pretty=format:'- %s (%h)' "$prev_tag..$tag")
          else
            commits=$(git log --pretty=format:'- %s (%h)' -n 50 "$tag")
          fi

          # Build the release body.
          {
            echo "## nSelf CLI $tag"
            echo ""
            echo "**Channel:** \`$channel\`"
            echo ""
            if [ -n "$changelog_section" ]; then
              echo "### Changelog"
              echo ""
              echo "$changelog_section"
              echo ""
            fi
            echo "### Commits since previous release"
            echo ""
            echo "$commits"
            echo ""
            echo "### Install"
            echo ""
            echo '```bash'
            echo "brew install nself-org/nself/nself"
            echo "# or download a tarball below for your platform"
            echo '```'
            echo ""
            echo "### Verify (Sigstore keyless)"
            echo ""
            echo '```bash'
            echo "cosign verify-blob \\"
            echo "  --bundle <tarball>.tar.gz.sig \\"
            echo "  --certificate-identity-regexp '^https://github.com/nself-org/cli/\\.github/workflows/release\\.yml@refs/tags/$tag\$' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  <tarball>.tar.gz"
            echo '```'
            echo ""
            echo "Full signing + verification details: [release-signing.md](https://github.com/nself-org/nself/blob/main/.claude/docs/operations/release-signing.md)"
            echo ""
            echo "### Artifacts"
            echo ""
            echo "- Platform tarballs (linux/darwin × amd64/arm64) + Windows zips (amd64/arm64)"
            echo "- \`checksums.txt\` — SHA-256 of all tarballs"
            echo "- \`sbom.spdx.json\` + per-tarball SBOMs — SPDX software bill of materials"
            echo "- \`provenance.intoto.jsonl\` — SLSA v1.0 provenance attestation"
            echo "- \`*.sig\` — Sigstore cosign signature bundles for every artifact above"
          } > release-body.md

          echo "path=release-body.md" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: ${{ steps.body.outputs.path }}
          prerelease: ${{ steps.channel.outputs.channel != 'stable' }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/sbom.spdx.json
            dist/sbom.cdx.json
            dist/sbom.cdx.json.bundle
            dist/provenance.intoto.jsonl
            dist/*.sig

      # Guard: skip cross-repo dispatch with a visible warning when HOMEBREW_TAP_TOKEN
      # is absent OR invalid (expired/revoked).  Release artifacts are already published
      # at this point; the dispatch is a best-effort post-publish notification only.
      # Formula correctness is independently enforced by the verify-homebrew-lockstep
      # gate job (required check) — a skipped dispatch does NOT affect release integrity.
      # To restore auto-dispatch: rotate HOMEBREW_TAP_TOKEN to a valid PAT with
      # contents:write + actions:write scoped to nself-org/homebrew-nself and
      # nself-org/admin, then add/update the secret in nself-org/cli Settings →
      # Secrets → Actions.
      #
      # NOTE: we intentionally do NOT use continue-on-error here.  Instead we probe
      # the token validity before invoking peter-evans/repository-dispatch so that a
      # bad token causes a clean skip (exit 0) rather than a red step.  This is a
      # correctness fix, not a CI bypass — the release itself is unaffected either way.
      - name: Probe cross-repo dispatch token validity
        if: steps.channel.outputs.channel == 'stable'
        id: dispatch-check
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          # Handle absent token first (empty string — secret not configured at all).
          if [ -z "${TAP_TOKEN}" ]; then
            echo "tap_token_ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Cross-repo dispatch skipped::HOMEBREW_TAP_TOKEN secret is not configured in nself-org/cli — homebrew tap and admin Docker rebuild were NOT triggered for ${{ github.ref_name }}. Formula correctness is enforced by verify-homebrew-lockstep. Add HOMEBREW_TAP_TOKEN to enable automatic post-release dispatch."
            exit 0
          fi
          # Probe the token against EVERY repo it dispatches to, with a lightweight
          # authenticated GET.  A 200 means the token is valid and has at least read
          # access.  401 or 403 means the token is present but invalid/expired/lacks
          # permission.  We use curl -o /dev/null so no repo data is printed; only the
          # HTTP status matters.  The token is passed via step env: (valid context) —
          # never in if:.
          #
          # Both dispatch steps below use this one token but target DIFFERENT repos.
          # Probing only homebrew-nself meant a PAT scoped to the tap but not to admin
          # passed the gate, fired the tap dispatch, and then failed on the admin
          # dispatch after the release had already published.  Whoever mints the PAT
          # must give it repo scope on BOTH repos, and this probe now proves it.
          HTTP_STATUS=200
          for REPO in nself-org/homebrew-nself nself-org/admin; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${TAP_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}")
            echo "probe ${REPO}: HTTP ${STATUS}"
            if [ "${STATUS}" != "200" ]; then
              HTTP_STATUS="${STATUS} on ${REPO}"
            fi
          done
          if [ "${HTTP_STATUS}" = "200" ]; then
            echo "tap_token_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "tap_token_ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Cross-repo dispatch skipped::HOMEBREW_TAP_TOKEN is present but returned HTTP ${HTTP_STATUS} against nself-org/homebrew-nself — token may be expired or lack required scopes. Homebrew tap and admin Docker rebuild were NOT triggered for ${{ github.ref_name }}. Formula correctness is enforced by verify-homebrew-lockstep. Rotate the token to restore auto-tap-update."
          fi

      - name: Trigger homebrew tap update (stable only)
        if: steps.channel.outputs.channel == 'stable' && steps.dispatch-check.outputs.tap_token_ok == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: nself-org/homebrew-nself
          event-type: cli-release
          client-payload: '{"tag": "${{ github.ref_name }}", "version": "${{ github.ref_name }}", "channel": "stable", "sha256": "${{ needs.build.outputs.source_sha256 }}"}'

      - name: Trigger admin Docker rebuild (stable only — CLI↔Admin lockstep per S34-T12)
        if: steps.channel.outputs.channel == 'stable' && steps.dispatch-check.outputs.tap_token_ok == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: nself-org/admin
          event-type: cli-release
          client-payload: '{"tag": "${{ github.ref_name }}", "version": "${{ github.ref_name }}"}'
