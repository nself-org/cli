name: Security Scan

on:
  schedule:
    - cron: "0 9 * * 1"
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        run: bash .github/scripts/go-install-retry.sh golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Run govulncheck
        env:
          GOFLAGS: -mod=vendor
        run: bash .github/scripts/govuln-gate.sh
      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar xz -C /usr/local/bin gitleaks
      - name: Configure git for gitleaks
        run: git config diff.renameLimit 1861
      - name: Scan for secrets
        run: gitleaks detect --source=. --log-level=warn --redact --config .github/gitleaks.toml
