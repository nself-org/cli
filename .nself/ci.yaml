# nself-ci configuration for the cli repo (contract:ci.pipeline-config v1).
#
# Purpose: declare the pipelines `nself ci` runs for this repository. Today that
#   is one scheduled pipeline, `drills` (P7-CI-18).
# Drills: every directory of scripts/drill/legs that holds an executable `run`
#   is one `kind: drill` job named `drill-<dir>`, so adding a drill needs no edit
#   here. The first one, two-command, wraps scripts/drill/two-command.sh. See
#   .github/wiki/Drills.md and the nightly workflow .github/workflows/drill-nightly.yml.
# max_age: what `nself ci evidence --pipeline drills` reports as overdue (exit 10)
#   when a drill has not passed within it.
# No `jobs:` block on purpose: declaring jobs turns catalogue detection off, which
#   would empty this repository's default pipeline.

version: 1

pipelines:
  drills:
    triggers: [schedule, manual]
    schedule: "30 2 * * *"
    max_age: 36h
    drills_dir: scripts/drill/legs
