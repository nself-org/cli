# Hasura Cloud stand-in for the P7-ADOPT-11 e2e: a Postgres database plus graphql-engine, the same
# pair Hasura Cloud runs for a project (the cloud's database is external; the metadata API is the
# engine's). Image digests are the ones nSelf's v1.4 stack pins (hasura-v14). Secrets are fake
# values generated by scripts/e2e/import-hasura-cloud.sh for one run.
services:
  postgres:
    image: postgres:16@sha256:75adc2a65806c96bc0e59030230bfe3f1c1b0d6d8f8181a8913e2b8b53bdc166
    environment:
      POSTGRES_PASSWORD: ${FIXTURE_PASSWORD:?}
    ports: ["127.0.0.1:${FIXTURE_PORT:?}:5432"]
    volumes: ["./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro"]
    # The TCP check: during first-run init the temporary server only listens on the unix socket, so
    # a socket check turns healthy too early and hasura then exits on "database system is starting up".
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 60
  hasura:
    image: hasura/graphql-engine:v2.44.0@sha256:4d34476840601fa0c372bce9b1ed15aac6ffc3f0a0db677e81062764c08e1dc5
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:${FIXTURE_PASSWORD:?}@postgres:5432/postgres
      HASURA_GRAPHQL_ADMIN_SECRET: ${FIXTURE_ADMIN_SECRET:?}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "false"
    ports: ["127.0.0.1:${FIXTURE_HASURA_PORT:?}:8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 60
