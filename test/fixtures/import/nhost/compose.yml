# nhost self-hosted composition for the P7-ADOPT-11 e2e: postgres + hasura + hasura-auth +
# hasura-storage + minio. Images are the exact digests nSelf's own v1.4 stack pins (hasura-v14,
# auth-v14, storage), so the source is what a v1.4 nSelf or a self-hosted nhost really runs.
# Every secret is a fake value generated by scripts/e2e/import-nhost.sh for one run.
services:
  postgres:
    image: postgres:16@sha256:75adc2a65806c96bc0e59030230bfe3f1c1b0d6d8f8181a8913e2b8b53bdc166
    environment:
      POSTGRES_PASSWORD: ${FIXTURE_PASSWORD:?}
    ports: ["127.0.0.1:${FIXTURE_PORT:?}:5432"]
    volumes: ["./init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    # The TCP check: during first-run init the temporary server only listens on the unix socket, so
    # a socket check turns healthy too early and hasura then exits on "database system is starting up".
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 60
  minio:
    image: pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: server /data
    environment:
      MINIO_ROOT_USER: ${FIXTURE_S3_ACCESS:?}
      MINIO_ROOT_PASSWORD: ${FIXTURE_S3_SECRET:?}
    ports: ["127.0.0.1:${FIXTURE_S3_PORT:?}:9000"]
  hasura:
    image: hasura/graphql-engine:v2.44.0@sha256:4d34476840601fa0c372bce9b1ed15aac6ffc3f0a0db677e81062764c08e1dc5
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:${FIXTURE_PASSWORD:?}@postgres:5432/postgres
      HASURA_GRAPHQL_ADMIN_SECRET: ${FIXTURE_ADMIN_SECRET:?}
      HASURA_GRAPHQL_JWT_SECRET: '{"type":"HS256","key":"${FIXTURE_JWT_KEY:?}"}'
      HASURA_GRAPHQL_ENABLE_CONSOLE: "false"
    ports: ["127.0.0.1:${FIXTURE_HASURA_PORT:?}:8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 60
  auth:
    image: nhost/auth:0.36.0@sha256:2e0713ef06e9c3c0af086c81289e9efbd87e4fa5dcda26891e5977b1e096caaf
    depends_on:
      hasura: {condition: service_healthy}
    environment:
      AUTH_HOST: 0.0.0.0
      AUTH_PORT: "4000"
      AUTH_CLIENT_URL: http://localhost:3000
      AUTH_SERVER_URL: http://localhost:4000
      AUTH_EMAIL_SIGNIN_EMAIL_VERIFIED_REQUIRED: "false"
      AUTH_ACCESS_CONTROL_ALLOWED_REDIRECT_URLS: http://localhost:3000
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:${FIXTURE_PASSWORD:?}@postgres:5432/postgres
      HASURA_GRAPHQL_GRAPHQL_URL: http://hasura:8080/v1/graphql
      HASURA_GRAPHQL_ADMIN_SECRET: ${FIXTURE_ADMIN_SECRET:?}
      HASURA_GRAPHQL_JWT_SECRET: '{"type":"HS256","key":"${FIXTURE_JWT_KEY:?}"}'
    ports: ["127.0.0.1:${FIXTURE_AUTH_PORT:?}:4000"]
  storage:
    image: nhost/hasura-storage:0.6.1@sha256:77cbc3722d82abd496cc5de42aacc148be55398c4c6910b76b96cbac10864ec2
    depends_on:
      hasura: {condition: service_healthy}
      minio: {condition: service_started}
    command:
      - serve
      - --hasura-endpoint=http://hasura:8080/v1
      - --hasura-metadata
      - --postgres-migrations
      - --postgres-migrations-source=postgres://postgres:${FIXTURE_PASSWORD:?}@postgres:5432/postgres?sslmode=disable
      - --s3-endpoint=http://minio:9000
      - --s3-bucket=${FIXTURE_S3_BUCKET:?}
      - --s3-region=us-east-1
      - --public-url=http://localhost:${FIXTURE_STORAGE_PORT:?}
    environment:
      HASURA_GRAPHQL_ADMIN_SECRET: ${FIXTURE_ADMIN_SECRET:?}
      S3_ACCESS_KEY: ${FIXTURE_S3_ACCESS:?}
      S3_SECRET_KEY: ${FIXTURE_S3_SECRET:?}
    ports: ["127.0.0.1:${FIXTURE_STORAGE_PORT:?}:8000"]
