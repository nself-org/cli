# Supabase fixture (EPIC D11): postgres + gotrue + storage-api (file backend), pinned by digest.
# Secrets come from the environment the e2e script generates; nothing here is a real credential.
services:
  db:
    image: supabase/postgres:15.8.1.135@sha256:ee680a0afebe1a5e95614fdea671c01a264e58f52de6c429c17a394f46dec2c6
    environment:
      POSTGRES_PASSWORD: ${FIXTURE_PASSWORD:?}
      JWT_SECRET: ${FIXTURE_JWT_SECRET:?}
    ports: ["127.0.0.1:${FIXTURE_PORT:-25432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 3s
      timeout: 3s
      retries: 60
  auth:
    image: supabase/gotrue:v2.197.0@sha256:1736a63078f5922b198c4cbe50f80ab9a2d3b54fe8b7b6cfb2e9dc5dbbc12c6b
    depends_on:
      db: {condition: service_healthy}
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://127.0.0.1:${FIXTURE_AUTH_PORT:-25433}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${FIXTURE_PASSWORD:?}@db:5432/postgres
      GOTRUE_SITE_URL: http://127.0.0.1:3000
      GOTRUE_JWT_SECRET: ${FIXTURE_JWT_SECRET:?}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
    ports: ["127.0.0.1:${FIXTURE_AUTH_PORT:-25433}:9999"]
  storage:
    image: supabase/storage-api:v1.81.1@sha256:e049f1f602fede44ae88472ee64390d21556e8d6b26e865a4b2f6475289d1186
    depends_on:
      db: {condition: service_healthy}
    environment:
      ANON_KEY: ${FIXTURE_ANON_KEY:?}
      SERVICE_KEY: ${FIXTURE_SERVICE_KEY:?}
      AUTH_JWT_SECRET: ${FIXTURE_JWT_SECRET:?}
      PGRST_JWT_SECRET: ${FIXTURE_JWT_SECRET:?}
      DATABASE_URL: postgres://supabase_storage_admin:${FIXTURE_PASSWORD:?}@db:5432/postgres
      POSTGREST_URL: http://127.0.0.1:3000
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: fixture
      REGION: local
      GLOBAL_S3_BUCKET: fixture
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes: ["storage-data:/var/lib/storage"]
    ports: ["127.0.0.1:${FIXTURE_STORAGE_PORT:-25434}:5000"]
volumes:
  storage-data:
