version: 2

project_name: nself

# Snapshot config: allows `goreleaser build --snapshot --clean` for local
# dry-run validation without a real tag. The snapshot name encodes the commit.
snapshot:
  version_template: "{{ .Version }}-dev+{{ .ShortCommit }}"

# The ping licence public keys are committed in internal/license/keys.go; no
# key is injected at build time and no build tag is set here.

builds:
  - id: nself
    main: ./cmd/nself/
    binary: nself
    env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -mod=vendor
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/nself-org/cli/internal/version.Version={{ .Version }}
      - -X github.com/nself-org/cli/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/nself-org/cli/internal/version.BuildDate={{ .Date }}
    # Windows binaries (amd64 + arm64) ship from v1.0.12 (P97 G3-T01).
    # Native Windows is best-effort: the trust subsystem (DNS / pfctl / mkcert)
    # falls through to "unsupported OS" at runtime — Windows users should run
    # nself inside WSL2 (see .github/wiki/windows-wsl2.md).
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    # Windows releases ship as zip; linux and darwin as tar.gz.
    # goreleaser v2 uses `formats` (list) not `format` (string).
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  github:
    owner: nself-org
    name: cli
  draft: false
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
